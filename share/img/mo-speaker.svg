<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img"
  aria-label="스피커의 구조 단면. 왼쪽에 고정된 자석이 있고, 그 앞에 구리 코일이 있으며, 코일은 깔때기 모양의 진동판에 연결되어 있다. 코일에 흐르는 전류의 방향이 바뀌면 코일이 받는 힘의 방향이 바뀌어 진동판이 진동하고, 오른쪽으로 소리가 퍼져 나간다.">
  <rect x="0" y="0" width="560" height="300" fill="#f9f2e3"/>
  <!-- 진동판(콘) -->
  <polygon points="176,133 336,74 336,226 176,167" fill="#f4ead2" stroke="#a08b64" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="300" y="252" text-anchor="middle" font-family="Gowun Dodum, Pretendard, sans-serif" font-size="15" fill="#4a3a26">진동판(콘)</text>
  <!-- 진동 화살표 (콘 안) -->
  <g stroke="#7d5ba6" stroke-width="2.4" fill="#7d5ba6">
    <line x1="248" y1="150" x2="300" y2="150"/>
    <polygon points="242,150 254,144 254,156"/>
    <polygon points="306,150 294,144 294,156"/>
  </g>
  <text x="274" y="140" text-anchor="middle" font-family="Gowun Dodum, Pretendard, sans-serif" font-size="13.5" font-weight="700" fill="#7d5ba6">진동</text>

  <!-- 고정된 자석 -->
  <rect x="36" y="86" width="76" height="128" rx="8" fill="#d8cdbb" stroke="#8a755c" stroke-width="2"/>
  <rect x="45" y="94" width="58" height="53" rx="4" fill="#f1d4cf"/>
  <rect x="45" y="153" width="58" height="53" rx="4" fill="#cfdcea"/>
  <text x="74" y="128" text-anchor="middle" font-family="Gowun Dodum, Pretendard, sans-serif" font-size="24" font-weight="800" fill="#b3362e">N</text>
  <text x="74" y="192" text-anchor="middle" font-family="Gowun Dodum, Pretendard, sans-serif" font-size="24" font-weight="800" fill="#2e5f8f">S</text>
  <text x="74" y="234" text-anchor="middle" font-family="Gowun Dodum, Pretendard, sans-serif" font-size="14" fill="#6b573f">고정된 자석</text>

  <!-- 코일 (구리) -->
  <g stroke="#a05c2c" stroke-width="3" fill="none">
    <ellipse cx="130" cy="150" rx="7" ry="24"/>
    <ellipse cx="143" cy="150" rx="7" ry="24"/>
    <ellipse cx="156" cy="150" rx="7" ry="24"/>
    <ellipse cx="169" cy="150" rx="7" ry="24"/>
  </g>
  <line x1="169" y1="150" x2="180" y2="150" stroke="#a05c2c" stroke-width="3"/>
  <text x="150" y="200" text-anchor="middle" font-family="Gowun Dodum, Pretendard, sans-serif" font-size="14" fill="#a05c2c">코일</text>

  <!-- 코일이 받는 힘 (양방향) -->
  <g stroke="#7d5ba6" stroke-width="3" fill="#7d5ba6">
    <line x1="120" y1="108" x2="196" y2="108"/>
    <polygon points="112,108 126,101 126,115"/>
    <polygon points="204,108 190,101 190,115"/>
  </g>
  <text x="158" y="96" text-anchor="middle" font-family="Gowun Dodum, Pretendard, sans-serif" font-size="13.5" font-weight="700" fill="#7d5ba6">코일이 받는 힘</text>

  <!-- 전류(신호) -->
  <line x1="145" y1="174" x2="145" y2="252" stroke="#a05c2c" stroke-width="2.4"/>
  <line x1="158" y1="174" x2="158" y2="252" stroke="#a05c2c" stroke-width="2.4"/>
  <rect x="112" y="252" width="104" height="36" rx="8" fill="#f6eedb" stroke="#a08b64" stroke-width="1.6"/>
  <path d="M120 270 q6 -9 12 0 t12 0" fill="none" stroke="#a05c2c" stroke-width="2"/>
  <text x="178" y="267" text-anchor="middle" font-family="Gowun Dodum, Pretendard, sans-serif" font-size="12.5" font-weight="700" fill="#4a3a26">전류(신호)</text>
  <text x="164" y="282" text-anchor="middle" font-family="Gowun Dodum, Pretendard, sans-serif" font-size="11.5" fill="#6b573f">방향이 바뀜</text>

  <!-- 소리 -->
  <g fill="none" stroke="#9a8a70" stroke-width="2.4" stroke-linecap="round">
    <path d="M357 124 A34 34 0 0 1 357 176"/>
    <path d="M369 112 A52 52 0 0 1 369 188"/>
    <path d="M381 100 A70 70 0 0 1 381 200"/>
  </g>
  <text x="430" y="150" text-anchor="middle" font-family="Gowun Dodum, Pretendard, sans-serif" font-size="16" font-weight="700" fill="#6b573f">소리</text>
</svg>
