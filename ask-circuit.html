<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>불이 켜지려면 무엇이 필요할까 · 회로 잇기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
 --abyss:#f2eade; --surface2:#fffcf4; --line:#c1ac82; --line-soft:#dccfae;
 --ink:#2e2315; --ink-dim:#5c4a33; --ink-mute:#96805c;
 --accent:#a05c2c; --gold:#8a5f24; --ok:#2c7a44; --danger:#b3362e;
 --c-plus:#b23a30; --c-minus:#2e5f8f; --wire:#8d7a5c; --lit:#e0952f;
 --disp:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
 --jua:"Jua",var(--disp); --gowun:"Gowun Dodum",var(--disp);
 --r:16px; --shadow:0 18px 50px -22px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overscroll-behavior:none}
body{font-family:var(--disp);color:var(--ink);background:
 radial-gradient(900px 560px at 8% 6%, rgba(160,92,44,.08), transparent 60%),
 radial-gradient(700px 480px at 92% 90%, rgba(44,110,95,.07), transparent 55%),
 var(--abyss); min-height:100vh; -webkit-font-smoothing:antialiased}

header.top{padding:22px 20px 4px; text-align:center}
header.top h1{font-family:var(--jua); font-size:clamp(21px,4.2vw,32px); line-height:1.3}
header.top h1 .em{color:var(--accent)}
.wrap{max-width:860px; margin:0 auto; padding:12px 16px 40px}

/* 미션 진행 */
.steps{display:flex; gap:8px; justify-content:center; margin:14px 0 6px; flex-wrap:wrap}
.st{display:flex; align-items:center; gap:8px; background:var(--surface2); border:1.5px solid var(--line-soft);
 border-radius:999px; padding:8px 16px 8px 11px; font-family:var(--gowun); font-size:13.5px;
 color:var(--ink-mute); transition:.2s}
.st .no{width:20px;height:20px;border-radius:50%;background:var(--line-soft);color:#fff;flex:none;
 display:grid;place-items:center;font-size:12px;font-family:var(--jua)}
.st.now{border-color:var(--accent); color:var(--accent); background:#fbf1e4; box-shadow:0 0 0 3px rgba(160,92,44,.12)}
.st.now .no{background:var(--accent)}
.st.done{border-color:var(--ok); color:var(--ok)}
.st.done .no{background:var(--ok)}
.st .rs{font-family:var(--jua); font-size:13px}

/* 지금 할 일 띠 */
#todo{margin:12px auto 0; max-width:720px; display:flex; gap:11px; align-items:center;
 background:#fbf1e4; border:1.6px solid var(--accent); border-radius:14px; padding:13px 18px;
 font-family:var(--gowun); font-size:15.5px; line-height:1.6; color:var(--ink-dim)}
#todo .ic{font-size:20px; flex:none}
#todo b{color:var(--accent); font-family:var(--disp)}

.card{background:rgba(255,252,244,.82); border:1.5px solid var(--line); border-radius:var(--r);
 box-shadow:var(--shadow); overflow:hidden; margin-top:14px}
.card-h{display:flex; align-items:center; gap:9px; padding:10px 16px; border-bottom:1px dashed var(--line-soft)}
.card-h .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.card-h h2{font-family:var(--jua); font-size:16px; color:var(--gold)}
.card-h .hint{margin-left:auto; font-size:12.5px; color:var(--ink-mute); font-family:var(--gowun)}

#board{display:block; width:100%; height:auto; aspect-ratio:640/380; touch-action:none;
 user-select:none; -webkit-user-select:none}
.boardbox{background:linear-gradient(180deg,#efe6d3,#e7dcc4); padding:4px 8px}

/* 선반 — 가로 띠 */
.shelf{padding:12px 14px 14px}
.shelf .items{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.pit{background:var(--surface2); border:1.6px solid var(--line-soft); border-radius:12px;
 padding:8px 10px 5px; cursor:grab; touch-action:none; text-align:center; transition:.15s;
 width:132px; position:relative}
.pit:hover{border-color:var(--accent); transform:translateY(-2px)}
.pit.sel{border-color:var(--accent); background:#fbf0df; box-shadow:0 0 0 3px rgba(160,92,44,.18)}
.pit.used{opacity:.26; pointer-events:none; filter:grayscale(1)}
.pit svg{display:block; width:100%; height:auto; aspect-ratio:148/56}
.pit .nm{font-family:var(--gowun); font-size:12.5px; color:var(--ink-dim); margin-top:3px}
.shelf .empty{font-family:var(--gowun); font-size:13.5px; color:var(--ink-mute); padding:14px}

#ghost{position:fixed; left:0; top:0; z-index:90; pointer-events:none; width:132px;
 opacity:.92; display:none; filter:drop-shadow(0 8px 16px rgba(0,0,0,.28))}

/* 조작 */
.acts{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:16px}
.btn{font-family:var(--jua); font-size:16px; padding:12px 26px; border-radius:12px; cursor:pointer;
 border:1.8px solid var(--line); background:var(--surface2); color:var(--ink-dim); transition:.15s}
.btn:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent); color:#fdf6e8; border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08); color:#fdf6e8}
.btn:disabled{opacity:.38; cursor:not-allowed}

/* 팝업 */
#pop{position:fixed; inset:0; z-index:120; display:none; align-items:center; justify-content:center;
 background:rgba(46,35,21,.52); padding:20px}
#pop.on{display:flex}
.popbox{background:#fffdf6; border:2px solid var(--line); border-radius:20px; max-width:520px; width:100%;
 padding:26px 26px 22px; box-shadow:0 30px 70px -20px rgba(0,0,0,.5); text-align:center;
 max-height:88vh; overflow-y:auto}
@media (prefers-reduced-motion:no-preference){ #pop.on .popbox{animation:popIn .22s cubic-bezier(.2,1.1,.4,1) both} }
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.popbox .kicker{font-family:var(--jua); font-size:13.5px; color:var(--accent); letter-spacing:.02em}
.popbox h3{font-family:var(--jua); font-size:22px; margin-top:6px; line-height:1.35}
.popbox .body{font-family:var(--gowun); font-size:16px; line-height:1.75; color:var(--ink-dim); margin-top:14px}
.popbox .body b{color:var(--ink); font-family:var(--disp)}
.popbox .big{font-family:var(--jua); font-size:19px; margin-top:16px; line-height:1.5}
.popbox .big.no{color:var(--ink-mute)} .popbox .big.yes{color:var(--lit)}
.poprow{display:flex; gap:10px; justify-content:center; margin-top:20px; flex-wrap:wrap}
.poprow .btn{font-size:16.5px; padding:13px 28px}
.judge{margin-top:16px; padding:12px 16px; border-radius:12px; font-family:var(--gowun); font-size:15px}
.judge.miss{background:#fdf0e2; border:1.5px solid var(--accent); color:var(--accent); font-weight:700}
.judge.hit{background:#f0f7ee; border:1.5px solid var(--ok); color:var(--ok)}
.qbox{margin-top:18px; padding:15px 18px; border-radius:14px; border:1.6px solid var(--accent);
 background:rgba(160,92,44,.07); font-family:var(--gowun); font-size:16.5px; line-height:1.6}
.qbox b{color:var(--accent); font-family:var(--disp)}

/* 마무리 세 컷 */
.recap{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px}
@media (max-width:520px){ .recap{grid-template-columns:1fr} }
.rc{border:1.5px solid var(--line-soft); border-radius:12px; padding:11px 8px; background:#fbf6ea}
.rc .t{font-family:var(--jua); font-size:12.5px; color:var(--ink-mute)}
.rc .w{font-family:var(--gowun); font-size:12.5px; color:var(--ink-dim); margin:5px 0 7px; line-height:1.45}
.rc .r{font-family:var(--jua); font-size:15px}
.rc .r.y{color:var(--lit)} .rc .r.n{color:var(--ink-mute)}
.rc.miss{border-color:var(--accent)}

.backline{margin-top:24px; text-align:center}
.backline a{display:inline-flex; align-items:center; gap:8px; text-decoration:none; font-family:var(--jua);
 font-size:15px; color:var(--ink-dim); background:var(--surface2); border:1.5px solid var(--line);
 border-radius:12px; padding:11px 22px; transition:.15s}
.backline a:hover{border-color:var(--accent); color:var(--accent)}

#app-credit{width:100%;box-sizing:border-box;margin:2.5rem 0 0;padding:14px 12px;text-align:center;font-size:15px;
 line-height:1.6;color:#8a755c;font-family:system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;
 border-top:1px solid rgba(128,128,128,.25)}

@media (prefers-reduced-motion:no-preference){
 @keyframes glowpulse{0%,100%{opacity:.85}50%{opacity:.4}}
 .glow{animation:glowpulse 1.5s ease-in-out infinite}
 @keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(3px)}50%{transform:translateX(-3px)}}
 .shake{animation:shake .5s both}
}

/* 다른 페이지 안에 끼워 넣을 때 — 제목·푸터·돌아가기를 감춘다 */
html.embed body{background:none}
html.embed header.top, html.embed .backline, html.embed #app-credit{display:none}
html.embed .wrap{padding:4px 12px 12px; max-width:840px}
html.embed .card{box-shadow:none}
</style>
</head>
<body>

<header class="top">
  <h1>불이 켜지려면 <span class="em">무엇이 필요할까?</span></h1>
</header>

<div class="wrap">

  <div class="steps" id="steps"></div>
  <div id="todo"><span class="ic">👉</span><span id="todoTx">시작합니다.</span></div>

  <div class="card">
    <div class="card-h"><span class="dot"></span><h2>회로판</h2>
      <span class="hint">놓인 전선을 다시 누르면 선반으로 돌아갑니다</span></div>
    <div class="boardbox"><svg id="board" viewBox="0 0 640 380" width="640" height="380" role="img"
      aria-label="전지와 전구가 놓인 회로판. 전지에서 전구로 가는 왼쪽 길과 전구에서 전지로 돌아오는 오른쪽 길이 있고, 학생이 전선을 놓아 길을 잇는다."></svg></div>
    <div class="shelf"><div class="items" id="shelf"></div></div>
  </div>

  <div class="acts">
    <button class="btn primary" id="btnGo" disabled>⚡ 켜 보기</button>
    <button class="btn" id="btnAgain">↺ 이 미션 다시</button>
  </div>

  <div class="backline"><a href="03-current.html">← 수업 페이지로 돌아가기</a></div>
</div>

<div id="ghost"></div>
<div id="pop"><div class="popbox" id="popbox"></div></div>

<footer id="app-credit">© 2026 조승재(과학이조선생) · 해누리중학교 · All rights reserved<br><span style="font-size:13.5px;opacity:.85;">최종 업데이트: 2026-09-01</span></footer>

<script>
"use strict";
(function(){

if(/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');

/* ═══════════════════════════════════════════════════════════
   부품 그림 — 가로 148 × 세로 56 상자, 도선은 y=28 을 지난다
   ═══════════════════════════════════════════════════════════ */
function wireMini(){
  var s = '<line x1="6" y1="28" x2="142" y2="28" stroke="#8a6a3a" stroke-width="9" stroke-linecap="round"/>'
  /* 양 끝 집게 */
        + '<rect x="2" y="20" width="14" height="16" rx="4" fill="#5d6b7d"/>'
        + '<rect x="132" y="20" width="14" height="16" rx="4" fill="#5d6b7d"/>';
  return '<svg viewBox="0 0 148 56" width="148" height="56" aria-hidden="true">' + s + '</svg>';
}

/* ═══════════════════════════════════════════════════════════
   회로판
   ═══════════════════════════════════════════════════════════ */
var board = document.getElementById('board');
var BR = 26;                                   /* 전구 반지름 */
var BX = 320, BY = 92;                         /* 전구 중심 */
var PX = 308, MX = 332, EY = 300;              /* 전지 (+)판 · (−)판 · 아래 도선 높이 */

/* 두 길 — 꺾인 선. 전선을 놓으면 이 선이 살아난다. */
var PATH = {
  L: [[BX-BR,BY],[110,BY],[110,EY],[PX,EY]],
  R: [[BX+BR,BY],[530,BY],[530,EY],[MX,EY]]
};
var PATH_MID = { L:[110,196], R:[530,196] };   /* 안내 글자를 놓을 자리 */

function poly(pts){ return pts.map(function(p){ return p[0]+' '+p[1]; }).join(' L'); }

function drawPath(k, on, lit){
  var d = 'M' + poly(PATH[k]);
  if(!on){
    return '<path d="'+d+'" fill="none" stroke="#bcab88" stroke-width="3" stroke-dasharray="9 8"'
         + ' stroke-linecap="round" stroke-linejoin="round"/>';
  }
  var col = lit ? '#d98f24' : '#8a6a3a';
  return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="8" stroke-linecap="round"'
       + ' stroke-linejoin="round"'+(lit?' class="glow"':'')+'/>';
}

function drawBulb(lit){
  var st = 12, ar = 14, col = lit ? '#c67a12' : '#6b573f';
  var s = lit
    ? '<circle cx="'+BX+'" cy="'+BY+'" r="'+(BR+15)+'" fill="#e0952f" opacity=".26" class="glow"/>'
      + '<circle cx="'+BX+'" cy="'+BY+'" r="'+BR+'" fill="#ffe9b4"/>'
    : '<circle cx="'+BX+'" cy="'+BY+'" r="'+BR+'" fill="#fffcf4"/>';
  return s
    + '<circle cx="'+BX+'" cy="'+BY+'" r="'+BR+'" fill="none" stroke="'+col+'" stroke-width="3"/>'
    + '<line x1="'+(BX-BR)+'" y1="'+BY+'" x2="'+(BX-ar)+'" y2="'+BY+'" stroke="'+col+'" stroke-width="3"/>'
    + '<line x1="'+(BX+ar)+'" y1="'+BY+'" x2="'+(BX+BR)+'" y2="'+BY+'" stroke="'+col+'" stroke-width="3"/>'
    + '<path d="M'+(BX-ar)+' '+BY+' A '+ar+' '+ar+' 0 0 1 '+(BX+ar)+' '+BY+'" fill="none" stroke="'+col
    + '" stroke-width="3" stroke-linecap="round"/>'
    + '<text x="'+BX+'" y="'+(BY-BR-14)+'" text-anchor="middle" font-family="Jua, sans-serif" font-size="15"'
    + ' fill="#6b573f">전구</text>';
}

function drawBattery(){
  return '<line x1="'+PX+'" y1="'+(EY-22)+'" x2="'+PX+'" y2="'+(EY+22)+'" stroke="#b23a30" stroke-width="3.2"/>'
    + '<line x1="'+MX+'" y1="'+(EY-12)+'" x2="'+MX+'" y2="'+(EY+12)+'" stroke="#2e5f8f" stroke-width="8"/>'
    + '<text x="'+(PX-13)+'" y="'+(EY+46)+'" text-anchor="middle" font-family="Jua, sans-serif" font-size="15"'
    + ' fill="#b23a30">(+)</text>'
    + '<text x="'+(MX+15)+'" y="'+(EY+46)+'" text-anchor="middle" font-family="Jua, sans-serif" font-size="15"'
    + ' fill="#2e5f8f">(−)</text>'
    + '<text x="'+BX+'" y="'+(EY-38)+'" text-anchor="middle" font-family="Jua, sans-serif" font-size="15"'
    + ' fill="#6b573f">전지</text>';
}

function drawBoard(){
  var s = '';
  /* 아직 열리지 않은 길은 점선조차 그리지 않는다 —
     미션 1에서 오른쪽 길이 보이면 학생이 답을 미리 알아채 함정이 무너진다 */
  if(open.L || slots.L !== null) s += drawPath('L', slots.L !== null, lit);
  if(open.R || slots.R !== null) s += drawPath('R', slots.R !== null, lit);
  s += drawBattery() + drawBulb(lit);
  ['L','R'].forEach(function(k){
    var m = PATH_MID[k];
    if(slots[k] === null && open[k]){
      s += '<g class="drop" data-slot="'+k+'" style="cursor:pointer">'
         + '<rect x="'+(m[0]-52)+'" y="'+(m[1]-30)+'" width="104" height="60" rx="12"'
         + ' fill="rgba(255,252,244,.72)" stroke="#a05c2c" stroke-width="2" stroke-dasharray="7 6"/>'
         + '<text x="'+m[0]+'" y="'+(m[1]-4)+'" text-anchor="middle" font-family="Gowun Dodum, sans-serif"'
         + ' font-size="14" fill="#a05c2c" pointer-events="none">여기에</text>'
         + '<text x="'+m[0]+'" y="'+(m[1]+16)+'" text-anchor="middle" font-family="Gowun Dodum, sans-serif"'
         + ' font-size="14" fill="#a05c2c" pointer-events="none">전선을</text></g>';
    } else if(slots[k] !== null){
      s += '<g class="pl" data-slot="'+k+'" style="cursor:pointer">'
         + '<rect x="'+(m[0]-26)+'" y="'+(m[1]-26)+'" width="52" height="52" rx="12"'
         + ' fill="transparent"/></g>';
    }
  });
  board.innerHTML = s;
}

/* ═══════════════════════════════════════════════════════════
   미션
   ═══════════════════════════════════════════════════════════ */
var M = [
{
  n:1, kicker:'미션 1', head:'전구까지 길을 만들자',
  brief:'전기가 전지에서 출발해 <b>전구까지 도착</b>할 수 있도록,<br>'
       +'전선으로 <b>왼쪽 길</b>을 이으세요.',
  todo:'선반의 <b>전선</b>을 <b>왼쪽 길</b>에 놓으세요.',
  open:{L:true, R:false},
  bag:[{k:'ok'}],
  need:['L'],
  ask:'전기가 전구까지 도착했습니다. 이제 켜 볼까요?<br>전구에 <b>불이 켜질까요?</b>',
  q:'전구까지 <b>분명히 이었는데</b> 왜 켜지지 않을까요?'
},
{
  n:2, kicker:'미션 2', head:'반대쪽도 이어 보자',
  brief:'이번에는 전구의 <b>반대쪽</b>에서 전지로 가는<br>'
       +'<b>오른쪽 길</b>도 이어 보세요.',
  todo:'전선을 하나 더 받았습니다. <b>오른쪽 길</b>에 놓으세요.',
  open:{L:true, R:true},
  bag:[{k:'ok'},{k:'ok'}],
  preset:{L:0},                 /* 미션 1에서 놓은 왼쪽 전선을 그대로 둔다 */
  need:['L','R'],
  ask:'이번에는 <b>불이 켜질까요?</b>',
  q:'미션 1과 <b>딱 하나</b>가 달랐습니다. 무엇이 달랐나요?'
}];

var mi = 0;                       /* 진행 중인 미션 번호 */
var slots = {L:null, R:null};
var open  = {L:true, R:false};
var bag = [], lit = false, picked = null;
var log = [];                     /* {n, guess, lit} */

function partOf(uid){ for(var i=0;i<bag.length;i++) if(bag[i].uid===uid) return bag[i]; return null; }
function placed(){ return [slots.L, slots.R]; }
function inSlot(uid){ return placed().indexOf(uid) >= 0; }
function needMet(){ return M[mi].need.every(function(k){ return slots[k] !== null; }); }
/* 켜짐 판정은 오직 이 한 줄 — 두 길이 모두 이어져야 한다.
   미션마다 결과를 박아 두면 회로를 고쳐도 결과가 안 따라온다. */
function circuitLights(){
  return slots.L !== null && slots.R !== null;
}

/* ═══════════════════════════════════════════════════════════
   선반
   ═══════════════════════════════════════════════════════════ */
var shelfEl = document.getElementById('shelf');

function drawShelf(){
  if(!bag.length){ shelfEl.innerHTML = '<div class="empty">선반이 비었습니다.</div>'; return; }
  shelfEl.innerHTML = bag.map(function(p){
    return '<div class="pit'+(inSlot(p.uid)?' used':'')+(picked===p.uid?' sel':'')
         + '" data-uid="'+p.uid+'">'
         + wireMini() + '<div class="nm">전선</div></div>';
  }).join('');
}

/* ═══════════════════════════════════════════════════════════
   놓기 · 빼기 — 끌어놓기와 눌러서 놓기 둘 다
   ═══════════════════════════════════════════════════════════ */
function place(uid, k){
  if(uid === null || !open[k] || slots[k] !== null) return false;
  if(slots.L === uid) slots.L = null;
  if(slots.R === uid) slots.R = null;
  slots[k] = uid; picked = null; lit = false;
  render(); return true;
}
function pull(k){
  if(slots[k] === null) return;
  slots[k] = null; lit = false; render();
}

var ghost = document.getElementById('ghost'), drag = null;

function svgPt(cx, cy){
  var m = board.getScreenCTM(); if(!m) return null;
  var i = m.inverse();
  return { x: i.a*cx + i.c*cy + i.e, y: i.b*cx + i.d*cy + i.f };
}
function d2seg(p, a, b){
  var vx=b[0]-a[0], vy=b[1]-a[1], wx=p.x-a[0], wy=p.y-a[1];
  var L2=vx*vx+vy*vy, t = L2 ? Math.max(0, Math.min(1,(wx*vx+wy*vy)/L2)) : 0;
  var dx=p.x-(a[0]+t*vx), dy=p.y-(a[1]+t*vy);
  return Math.sqrt(dx*dx+dy*dy);
}
function slotAt(cx, cy){
  var p = svgPt(cx, cy); if(!p) return null;
  var best = null, bd = 56;
  ['L','R'].forEach(function(k){
    if(!open[k] || slots[k] !== null) return;
    var pts = PATH[k];
    for(var i=0;i<pts.length-1;i++){
      var d = d2seg(p, pts[i], pts[i+1]);
      if(d < bd){ bd = d; best = k; }
    }
  });
  return best;
}
function showGhost(uid,x,y){ ghost.innerHTML = wireMini(); ghost.style.display='block'; moveGhost(x,y); }
function moveGhost(x,y){ ghost.style.transform = 'translate('+(x-66)+'px,'+(y-28)+'px)'; }

shelfEl.addEventListener('pointerdown', function(e){
  var it = e.target.closest('.pit');
  if(!it || it.classList.contains('used')) return;
  e.preventDefault();
  drag = { uid:+it.dataset.uid, moved:false, sx:e.clientX, sy:e.clientY };
  try{ it.setPointerCapture(e.pointerId); }catch(_){}
});
document.addEventListener('pointermove', function(e){
  if(!drag) return;
  if(!drag.moved){
    if(Math.abs(e.clientX-drag.sx)<6 && Math.abs(e.clientY-drag.sy)<6) return;
    drag.moved = true; showGhost(drag.uid, e.clientX, e.clientY);
  }
  moveGhost(e.clientX, e.clientY);
});
document.addEventListener('pointerup', function(e){
  if(!drag) return;
  var d = drag; drag = null; ghost.style.display='none'; ghost.innerHTML='';
  if(d.moved){
    var k = slotAt(e.clientX, e.clientY);
    if(k) place(d.uid, k); else render();
  } else {
    picked = (picked === d.uid) ? null : d.uid; render();
  }
});
board.addEventListener('pointerdown', function(e){
  var pl = e.target.closest('.pl');
  if(pl){ pull(pl.dataset.slot); return; }
  var k = slotAt(e.clientX, e.clientY);
  if(k && picked !== null) place(picked, k);
});

/* ═══════════════════════════════════════════════════════════
   팝업
   ═══════════════════════════════════════════════════════════ */
var pop = document.getElementById('pop'), popbox = document.getElementById('popbox');
function openPop(html){ popbox.innerHTML = html; pop.classList.add('on'); }
function closePop(){ pop.classList.remove('on'); }
popbox.addEventListener('click', function(e){
  var b = e.target.closest('button[data-act]');
  if(b) ACT[b.dataset.act]();
});

var ACT = {};

/* ── 미션 브리핑 ───────────────────────────────────────── */
function briefPop(){
  var m = M[mi];
  openPop('<div class="kicker">'+m.kicker+'</div><h3>'+m.head+'</h3>'
        + '<div class="body">'+m.brief+'</div>'
        + '<div class="poprow"><button class="btn primary" data-act="start">해 볼게요</button></div>');
}
ACT.start = function(){ closePop(); };

/* ── 예상 받기 ─────────────────────────────────────────── */
function askPop(){
  var m = M[mi];
  openPop('<div class="kicker">'+m.kicker+' · 예상</div><h3>어떻게 될까요?</h3>'
        + '<div class="body">'+m.ask+'</div>'
        + '<div class="poprow">'
        + '<button class="btn primary" data-act="gYes">💡 켜진다</button>'
        + '<button class="btn" data-act="gNo">○ 안 켜진다</button></div>');
}
ACT.gYes = function(){ resolve(true); };
ACT.gNo  = function(){ resolve(false); };

/* ── 결과 ──────────────────────────────────────────────── */
function resolve(guess){
  closePop();
  var willLight = circuitLights();
  var btn = document.getElementById('btnGo');
  btn.disabled = true; btn.textContent = '켜는 중…';
  setTimeout(function(){
    lit = willLight; render();
    btn.textContent = '⚡ 켜 보기';
    if(!willLight){
      var bb = document.querySelector('.boardbox');
      bb.classList.add('shake'); setTimeout(function(){ bb.classList.remove('shake'); }, 520);
    }
    setTimeout(function(){ resultPop(guess, willLight); }, willLight ? 900 : 620);
  }, 1100);
}

function resultPop(guess, on){
  var m = M[mi];

  /* 미션 1 · 2 */
  log.push({ n:m.n, guess:guess, lit:on });
  openPop('<div class="kicker">'+m.kicker+' · 결과</div>'
        + '<h3>'+(on ? '켜졌습니다' : '켜지지 않았습니다')+'</h3>'
        + '<div class="big '+(on?'yes':'no')+'">'
        + (on ? '불이 켜졌습니다!' : '…불이 켜지지 않습니다.') + '</div>'
        + judgeHtml(guess, on)
        + '<div class="qbox">🤔 '+m.q+'</div>'
        + '<div class="poprow"><button class="btn primary" data-act="next">'
        + (mi < 1 ? '다음 미션으로 →' : '두 결과 나란히 보기 →') + '</button></div>');
}

function judgeHtml(guess, on){
  return guess === on
    ? '<div class="judge hit">예상대로예요.</div>'
    : '<div class="judge miss">✋ 예상과 달랐습니다!</div>';
}

ACT.next = function(){
  closePop();
  if(mi < 1){ mi++; startMission(); }
  else { donePop(); }
};

/* ── 마무리 ────────────────────────────────────────────── */
var WHAT = ['왼쪽 길만 이었다', '양쪽 길을 모두 이었다'];
function donePop(){
  var cells = log.map(function(r, i){
    return '<div class="rc'+(r.guess!==r.lit?' miss':'')+'"><div class="t">미션 '+r.n+'</div>'
         + '<div class="w">'+WHAT[i]+'</div>'
         + '<div class="r '+(r.lit?'y':'n')+'">'+(r.lit?'💡 켜짐':'○ 안 켜짐')+'</div></div>';
  }).join('');
  openPop('<div class="kicker">다 했습니다</div><h3>두 번의 결과</h3>'
        + '<div class="recap">'+cells+'</div>'
        + '<div class="qbox" style="margin-top:18px">🤔 <b>딱 한 곳</b>이 달랐을 뿐인데<br>'
        + '하나는 켜지고 하나는 켜지지 않았습니다.<br>'
        + '<b>불이 켜지려면 무엇이 필요할까요?</b></div>'
        + '<div class="poprow"><button class="btn" data-act="redo">↺ 처음부터</button>'
        + '<button class="btn primary" data-act="close">닫기</button></div>');
}
ACT.close = function(){
  closePop();
  document.getElementById('todoTx').innerHTML =
    '다 했습니다. 선생님 이야기를 들으며 <b>왜 그런지</b> 생각해 보세요.';
};
ACT.redo = function(){ closePop(); mi = 0; log = []; startMission(); };

/* ═══════════════════════════════════════════════════════════
   미션 시작 · 화면 갱신
   ═══════════════════════════════════════════════════════════ */
function startMission(){
  var m = M[mi];
  slots = {L:null, R:null};
  open = {L:m.open.L, R:m.open.R};
  bag = m.bag.map(function(b, i){ return { uid:i, k:b.k }; });
  if(m.preset) Object.keys(m.preset).forEach(function(k){ slots[k] = m.preset[k]; });
  lit = false; picked = null;
  render();
  briefPop();
}

function drawSteps(){
  var el = document.getElementById('steps');
  el.innerHTML = M.map(function(m, i){
    var r = log.filter(function(x){ return x.n === m.n; })[0];
    var cls = r ? 'done' : (i === mi ? 'now' : '');
    var tail = r ? '<span class="rs">'+(r.lit?'💡':'○')+'</span>' : '';
    return '<div class="st '+cls+'"><span class="no">'+m.n+'</span><span>'+m.head+'</span>'+tail+'</div>';
  }).join('');
}

function render(){
  drawBoard(); drawShelf(); drawSteps();
  var m = M[mi];
  document.getElementById('todoTx').innerHTML =
    needMet() ? '다 놓았습니다. <b>⚡ 켜 보기</b>를 누르세요.' : m.todo;
  var go = document.getElementById('btnGo');
  go.disabled = !needMet();
  go.textContent = '⚡ 켜 보기';
}

document.getElementById('btnGo').addEventListener('click', function(){
  if(needMet()) askPop();
});
document.getElementById('btnAgain').addEventListener('click', function(){
  log = log.filter(function(x){ return x.n !== M[mi].n; });
  startMission();
});

startMission();
})();
</script>
