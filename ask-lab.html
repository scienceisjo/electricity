<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전구가 어둠을 밝히기까지 · 가상 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
 --abyss:#f2eade; --surface2:#fffcf4; --line:#c1ac82; --line-soft:#dccfae;
 --ink:#2e2315; --ink-dim:#5c4a33; --ink-mute:#96805c;
 --accent:#a05c2c; --gold:#8a5f24;
 --disp:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
 --jua:"Jua",var(--disp); --gowun:"Gowun Dodum",var(--disp);
 --shadow:0 18px 50px -22px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--disp);color:var(--ink);background:
 radial-gradient(900px 560px at 8% 6%, rgba(160,92,44,.08), transparent 60%),
 radial-gradient(700px 480px at 92% 90%, rgba(44,110,95,.07), transparent 55%),
 var(--abyss); min-height:100vh; -webkit-font-smoothing:antialiased}

header.top{padding:22px 20px 2px; text-align:center}
header.top h1{font-family:var(--jua); font-size:clamp(21px,4.2vw,32px); line-height:1.3}
header.top h1 .em{color:var(--accent)}
header.top p{color:var(--ink-dim); margin-top:8px; font-size:clamp(13.5px,2.4vw,15.5px); font-family:var(--gowun)}
.wrap{max-width:900px; margin:0 auto; padding:10px 14px 34px}

/* 두 실험 고르기 */
.tabs{display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin:14px 0 12px}
.tb{font-family:var(--jua); font-size:16px; padding:12px 24px; border-radius:999px; cursor:pointer;
 border:1.8px solid var(--line); background:var(--surface2); color:var(--ink-dim); transition:.16s}
.tb:hover{border-color:var(--accent); color:var(--accent)}
.tb.on{background:var(--accent); border-color:var(--accent); color:#fdf6e8; box-shadow:var(--shadow)}
.tb .n{opacity:.8; margin-right:5px}

.lead{max-width:720px; margin:0 auto 12px; text-align:center; font-family:var(--gowun);
 font-size:15px; line-height:1.7; color:var(--ink-dim)}
.lead b{color:var(--accent); font-family:var(--disp)}

.frame{border:1.5px solid var(--line); border-radius:16px; overflow:hidden; background:#efe6d3;
 box-shadow:var(--shadow)}
.frame iframe{display:block; width:100%; height:820px; border:0}
.frame[hidden]{display:none}

.backline{margin-top:22px; text-align:center}
.backline a{display:inline-flex; align-items:center; gap:8px; text-decoration:none; font-family:var(--jua);
 font-size:15px; color:var(--ink-dim); background:var(--surface2); border:1.5px solid var(--line);
 border-radius:12px; padding:11px 22px; transition:.15s}
.backline a:hover{border-color:var(--accent); color:var(--accent)}

#app-credit{width:100%;box-sizing:border-box;margin:2.5rem 0 0;padding:14px 12px;text-align:center;font-size:15px;
 line-height:1.6;color:#8a755c;font-family:system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;
 border-top:1px solid rgba(128,128,128,.25)}

/* ① 성공 → ② 로 부르는 반짝임·안내 띠 */
.tb.pulse{animation:tbpulse 1.15s infinite}
@keyframes tbpulse{0%,100%{box-shadow:0 0 0 0 rgba(160,92,44,.55)}55%{box-shadow:0 0 0 11px rgba(160,92,44,0)}}
#nextUp{max-width:720px; margin:0 auto 12px; text-align:center; font-family:var(--gowun);
 font-size:14.5px; line-height:1.6; color:#2c6e5f; background:rgba(44,110,95,.11);
 border:1.5px solid #2c6e5f; border-radius:12px; padding:10px 16px}
#nextUp b{font-family:var(--disp)}
#nextUp[hidden]{display:none}

/* 수업 페이지 안에 끼워 넣을 때 */
html.embed body{background:none}
html.embed header.top, html.embed .backline, html.embed #app-credit{display:none}
html.embed .wrap{padding:2px 0 0; max-width:none}
html.embed .frame{border:0; border-radius:0; box-shadow:none}
</style>
</head>
<body>

<header class="top">
  <h1>전구가 <span class="em">어둠을 밝히기까지</span></h1>
  <p>전지가 없어도 켜지고, 전지가 있어도 안 켜집니다.<br>
  두 가지 실험을 해 보고 <b>궁금한 것</b>을 찾아보세요. 정답은 알려 주지 않습니다.</p>
</header>

<div class="wrap">
  <div class="tabs" id="tabs">
    <button class="tb on" data-k="eph"><span class="n">①</span>🔦 전지 없이 켜 보기</button>
    <button class="tb" data-k="cir"><span class="n">②</span>🔌 다 이었는데 안 켜진다</button>
  </div>

  <div id="nextUp" hidden>🎉 <b>① 성공!</b> 이제 위의 <b>② 다 이었는데 안 켜진다</b> 단추를 누르세요 — 이번엔 전지가 있는데도 안 켜집니다.</div>
  <p class="lead" id="lead"></p>

  <div class="frame" id="fr-eph"><iframe id="if-eph" title="정전기로 네온전구 켜기 가상 실험실"></iframe></div>
  <div class="frame" id="fr-cir" hidden><iframe id="if-cir" title="회로 잇기 가상 실험실" loading="lazy"></iframe></div>

  <div class="backline"><a href="03-current.html">← 수업 페이지로 돌아가기</a></div>
</div>

<footer id="app-credit">© 2026 조승재(과학이조선생) · 해누리중학교 · All rights reserved<br><span style="font-size:13.5px;opacity:.85;">최종 업데이트: 2026-09-01</span></footer>

<script>
"use strict";
(function(){

if(/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');

/* 두 실험 페이지를 그대로 불러온다 — 실험 자체는 각자 한 곳에서만 고친다 */
var SRC = {
  eph: 'ask-electrophorus.html',
  cir: 'ask-circuit.html'
};
var LEAD = {
  eph: '전지를 <b>하나도</b> 쓰지 않고 전구를 켜 봅니다. 어두운 실험실이 기본이에요.',
  cir: '전지도 전구도 있는데 <b>안 켜집니다.</b> 무엇이 빠졌는지 찾아보세요.'
};

var cur = 'eph', loaded = {};

function load(k){
  if(loaded[k]) return;
  document.getElementById('if-' + k).src = SRC[k] + '?embed=1';
  loaded[k] = true;
}

function show(k){
  cur = k;
  ['eph','cir'].forEach(function(x){
    document.getElementById('fr-' + x).hidden = (x !== k);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.tb'), function(b){
    b.classList.toggle('on', b.dataset.k === k);
  });
  document.getElementById('lead').innerHTML = LEAD[k];
  if(k === 'cir'){                          /* ② 로 들어오면 부르기를 멈춘다 */
    document.getElementById('nextUp').hidden = true;
    var tb2 = document.querySelector('.tb[data-k="cir"]');
    if(tb2) tb2.classList.remove('pulse');
  }
  load(k);
}

document.getElementById('tabs').addEventListener('click', function(e){
  var b = e.target.closest('.tb');
  if(b) show(b.dataset.k);
});

/* 실험실이 보내는 알림 — 여기서도 쓰고, 수업 페이지까지 그대로 넘겨 준다 */
addEventListener('message', function(e){
  if(!e.data || !e.data.t) return;
  if(e.data.t === 'electrophorusLit' && cur === 'eph'){
    /* ① 성공 — ② 를 반짝이며 부른다 */
    document.getElementById('nextUp').hidden = false;
    var tb2 = document.querySelector('.tb[data-k="cir"]');
    if(tb2) tb2.classList.add('pulse');
  }
  if(e.data.t === 'gotoCircuit') show('cir');
  try{ if(parent !== window) parent.postMessage(e.data, '*'); }catch(_){}
});

show('eph');
})();
</script>
</body>
</html>
