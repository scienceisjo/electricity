<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전지도 없이 전구를 켜 보자 · 가상 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
 --abyss:#f2eade; --surface2:#fffcf4; --line:#c1ac82; --line-soft:#dccfae;
 --ink:#2e2315; --ink-dim:#5c4a33; --ink-mute:#96805c;
 --accent:#a05c2c; --gold:#8a5f24; --ok:#2c7a44; --neon:#ff6a2a;
 --disp:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
 --jua:"Jua",var(--disp); --gowun:"Gowun Dodum",var(--disp);
 --r:16px; --shadow:0 18px 50px -22px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overscroll-behavior:none}
body{font-family:var(--disp);color:var(--ink);background:
 radial-gradient(900px 560px at 8% 6%, rgba(160,92,44,.08), transparent 60%),
 radial-gradient(700px 480px at 92% 90%, rgba(44,110,95,.07), transparent 55%),
 var(--abyss); min-height:100vh; -webkit-font-smoothing:antialiased}

header.top{padding:20px 20px 2px; text-align:center}
header.top h1{font-family:var(--jua); font-size:clamp(21px,4.2vw,32px); line-height:1.3}
header.top h1 .em{color:var(--accent)}
.wrap{max-width:900px; margin:0 auto; padding:10px 14px 40px}

.steps{display:flex; gap:7px; justify-content:center; margin:13px 0 4px; flex-wrap:wrap}
.st{display:flex; align-items:center; gap:7px; background:var(--surface2); border:1.5px solid var(--line-soft);
 border-radius:999px; padding:7px 14px 7px 10px; font-family:var(--gowun); font-size:13px;
 color:var(--ink-mute); transition:.2s}
.st .no{width:19px;height:19px;border-radius:50%;background:var(--line-soft);color:#fff;flex:none;
 display:grid;place-items:center;font-size:11.5px;font-family:var(--jua)}
.st.now{border-color:var(--accent); color:var(--accent); background:#fbf1e4; box-shadow:0 0 0 3px rgba(160,92,44,.12)}
.st.now .no{background:var(--accent)}
.st.done{border-color:var(--ok); color:var(--ok)} .st.done .no{background:var(--ok)}
.st.success{border-color:var(--ok); color:var(--ok); background:rgba(44,110,95,.14); font-weight:700;
 animation:stpop .5s} .st.success .no{background:var(--ok)}
@keyframes stpop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

#todo{margin:11px auto 0; max-width:740px; display:flex; gap:11px; align-items:center;
 background:#fbf1e4; border:1.6px solid var(--accent); border-radius:14px; padding:12px 18px;
 font-family:var(--gowun); font-size:15.5px; line-height:1.6; color:var(--ink-dim)}
#todo .ic{font-size:20px; flex:none} #todo b{color:var(--accent); font-family:var(--disp)}

.card{background:rgba(255,252,244,.82); border:1.5px solid var(--line); border-radius:var(--r);
 box-shadow:var(--shadow); overflow:hidden; margin-top:13px}
.card-h{display:flex; align-items:center; gap:9px; padding:10px 16px; border-bottom:1px dashed var(--line-soft)}
.card-h .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.card-h h2{font-family:var(--jua); font-size:16px; color:var(--gold)}
.card-h .hint{margin-left:auto; font-size:12.5px; color:var(--ink-mute); font-family:var(--gowun)}

#lab{display:block; width:100%; height:auto; aspect-ratio:820/480; touch-action:none;
 user-select:none; -webkit-user-select:none; cursor:default}
.labbox{background:#0f0c09; line-height:0}

.acts{display:flex; gap:9px; flex-wrap:wrap; justify-content:center; margin-top:14px}
.btn{font-family:var(--jua); font-size:15.5px; padding:11px 22px; border-radius:12px; cursor:pointer;
 border:1.8px solid var(--line); background:var(--surface2); color:var(--ink-dim); transition:.15s}
.btn:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent); color:#fdf6e8; border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08); color:#fdf6e8}
.btn:disabled{opacity:.36; cursor:not-allowed}
.btn[hidden]{display:none}
.nextbox{margin-top:12px; padding:12px 15px; border-radius:12px; background:rgba(44,110,95,.13);
 border:1.5px solid var(--ok); font-family:var(--gowun); font-size:14.5px; line-height:1.65}

#count{margin:13px auto 0; max-width:740px; text-align:center; font-family:var(--gowun);
 font-size:15px; color:var(--ink-dim)}
#count b{font-family:var(--jua); font-size:19px; color:var(--neon)}

#pop{position:fixed; inset:0; z-index:120; display:none; align-items:center; justify-content:center;
 background:rgba(20,14,8,.62); padding:20px}
#pop.on{display:flex}
.popbox{background:#fffdf6; border:2px solid var(--line); border-radius:20px; max-width:520px; width:100%;
 padding:25px 26px 21px; box-shadow:0 30px 70px -20px rgba(0,0,0,.6); text-align:center;
 max-height:88vh; overflow-y:auto}
@media (prefers-reduced-motion:no-preference){ #pop.on .popbox{animation:popIn .22s cubic-bezier(.2,1.1,.4,1) both} }
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.popbox .kicker{font-family:var(--jua); font-size:13.5px; color:var(--accent)}
.popbox h3{font-family:var(--jua); font-size:22px; margin-top:5px; line-height:1.35}
.popbox .body{font-family:var(--gowun); font-size:16px; line-height:1.75; color:var(--ink-dim); margin-top:13px}
.popbox .body b{color:var(--ink); font-family:var(--disp)}
.popbox ol{text-align:left; margin:12px 4px 0 22px; font-family:var(--gowun); font-size:15.5px;
 line-height:1.8; color:var(--ink-dim)}
.poprow{display:flex; gap:10px; justify-content:center; margin-top:19px; flex-wrap:wrap}
.qbox{margin-top:16px; padding:15px 18px; border-radius:14px; border:1.6px solid var(--accent);
 background:rgba(160,92,44,.07); font-family:var(--gowun); font-size:16.5px; line-height:1.65}
.qbox b{color:var(--accent); font-family:var(--disp)}
.qbox + .qbox{margin-top:10px; border-style:dashed; font-size:15.5px}

.backline{margin-top:22px; text-align:center}
.backline a{display:inline-flex; align-items:center; gap:8px; text-decoration:none; font-family:var(--jua);
 font-size:15px; color:var(--ink-dim); background:var(--surface2); border:1.5px solid var(--line);
 border-radius:12px; padding:11px 22px; transition:.15s}
.backline a:hover{border-color:var(--accent); color:var(--accent)}

#app-credit{width:100%;box-sizing:border-box;margin:2.5rem 0 0;padding:14px 12px;text-align:center;font-size:15px;
 line-height:1.6;color:#8a755c;font-family:system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;
 border-top:1px solid rgba(128,128,128,.25)}

/* 수업 페이지 안에 끼워 넣을 때 — 제목·푸터·돌아가기를 감춘다 */
html.embed body{background:none}
html.embed header.top, html.embed .backline, html.embed #app-credit{display:none}
html.embed .wrap{padding:4px 12px 12px; max-width:840px}
html.embed .card{box-shadow:none}
</style>
</head>
<body>

<header class="top">
  <h1>전지도 없이 <span class="em">전구를 켜 보자</span></h1>
</header>

<div class="wrap">
  <div class="steps" id="steps"></div>
  <div id="todo"><span class="ic">👉</span><span id="todoTx">준비 중…</span></div>

  <div class="card">
    <div class="card-h"><span class="dot"></span><h2>실험대</h2>
      <span class="hint">도구를 끌어다 옮기세요</span></div>
    <div class="labbox"><svg id="lab" viewBox="0 0 820 480" width="820" height="480" role="img"
      aria-label="어두운 실험실 책상 위에 스타이로폼 접시, 털가죽, 수수깡 손잡이가 달린 알루미늄 접시, 네온전구가 놓여 있다. 도구를 끌어다 실험 순서를 따라 하면 네온전구가 순간적으로 켜진다."></svg></div>
  </div>

  <div class="acts">
    <button class="btn primary" id="btnFlip" hidden>접시 뒤집어 놓기</button>
    <button class="btn primary" id="btnLift" hidden>접시를 들었다 다시 놓기</button>
    <button class="btn" id="btnSlow" hidden>🐢 느리게 다시 보기</button>
    <button class="btn" id="btnLight">💡 교실 불 켜기</button>
    <button class="btn" id="btnReset">↺ 처음부터</button>
  </div>

  <div id="count"></div>

  <div class="backline"><a href="03-current.html">← 수업 페이지로 돌아가기</a></div>
</div>

<div id="pop"><div class="popbox" id="popbox"></div></div>

<footer id="app-credit">© 2026 조승재(과학이조선생) · 해누리중학교 · All rights reserved<br><span style="font-size:13.5px;opacity:.85;">최종 업데이트: 2026-09-01</span></footer>

<script>
"use strict";
(function(){

var lab = document.getElementById('lab');

/* 같은 화면이 매번 똑같이 나오도록 씨앗 난수를 쓴다 */
var seed = 20260901;
function rnd(){ seed = (seed*1664525 + 1013904223) % 4294967296; return seed/4294967296; }

/* ═══════════════════════════════════════════════════════════
   무대 좌표
   ═══════════════════════════════════════════════════════════ */
var DESK_Y  = 268;                       /* 책상 윗면이 시작되는 높이 */
var STY = {x:270, y:372, rx:132, ry:34};  /* 스타이로폼 접시 */
var ALU_ON  = {x:270, y:344, rx:106, ry:28};
var ALU_HOME= {x:630, y:330};
var FUR_HOME= {x:640, y:414};
var NEON_HOME={x:556, y:238};
var TOUCH   = {x:ALU_ON.x + ALU_ON.rx - 6, y:ALU_ON.y - 4};   /* 알루미늄 가장자리 */

var S = {
  step:0,            /* 0 문지르기 · 1 뒤집기 · 2 접시 올리기 · 3 전구 대기 · 4 끝 */
  rub:0,             /* 문지른 거리 */
  flipped:false, aluOn:false, armed:false,
  lit:0, dark:true,
  fur:{x:FUR_HOME.x, y:FUR_HOME.y},
  alu:{x:ALU_HOME.x, y:ALU_HOME.y},
  neon:{x:NEON_HOME.x, y:NEON_HOME.y}
};
var RUB_NEED = 900;                       /* 이만큼 문지르면 충분 */
function rubPct(){ return Math.min(1, S.rub / RUB_NEED); }

var EMBED = /[?&]embed=1/.test(location.search);
if(EMBED) document.documentElement.classList.add('embed');

/* ── 전하 표시 ────────────────────────────────────────────
   지난 차시에 배운 것(마찰전기 · 정전기 유도)까지만 보여 준다.
   스타이로폼은 부도체라 전하가 알루미늄으로 건너가지 않는다 —
   움직이는 것은 알루미늄 접시 안에 원래 있던 전하다. */
var STY_PTS = [], ALU_PTS = [], PLUS_PTS = [];
(function(){
  /* 스타이로폼 — 알루미늄 접시(rx 106)를 올려도 가려지지 않도록 바깥 테두리를 따라 둔다 */
  for(var i=0;i<14;i++){
    var a = (i/14)*6.2832 + 0.22;
    STY_PTS.push([STY.x + Math.cos(a)*(STY.rx-16), STY.y + Math.sin(a)*(STY.ry-6)]);
  }
  /* 알루미늄 — 접시 안에 원래 고르게 있던 전자가, 아래 스타이로폼의 (−)에 밀려
     먼 쪽(윗면)으로 몰린다. 스타이로폼에서 건너오는 것이 아니다. */
  for(var j=0;j<9;j++){
    var b = -0.82 + (j/8)*1.64;
    var w = Math.sqrt(1 - b*b) * 0.92;
    ALU_PTS.push({ x0: b*(ALU_ON.rx-26), y0: (j % 2 ? 9 : -7),   /* 처음 — 고르게 */
                   x1: b*(ALU_ON.rx-26), y1: -(ALU_ON.ry-4)*w });/* 나중 — 윗면으로 */
  }
  /* 전자가 빠져나간 아래쪽에는 (+)가 남는다 — 접시 전체 전하량은 그대로 0 */
  for(var q=0;q<7;q++){
    var c = -0.72 + (q/6)*1.44;
    PLUS_PTS.push({ x: c*(ALU_ON.rx-30), y: (ALU_ON.ry-9)*Math.sqrt(1-c*c)*0.72 });
  }
})();
var aluT = 0, chgA = 1, fading = false, animRun = false;

function minus(x, y, op){
  return '<g opacity="'+op.toFixed(2)+'"><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)
       + '" r="7" fill="#2f6ea8" stroke="#dceaf7" stroke-width="1.4"/>'
       + '<line x1="'+(x-4).toFixed(1)+'" y1="'+y.toFixed(1)+'" x2="'+(x+4).toFixed(1)+'" y2="'
       + y.toFixed(1)+'" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/></g>';
}
function chgSty(){
  if(chgA <= 0.02) return '';
  var n = Math.round(rubPct()*STY_PTS.length), g = '';
  for(var i=0;i<n;i++) g += minus(STY_PTS[i][0], STY_PTS[i][1], chgA);
  /* 알루미늄이 올라와 있으면 — 스타이로폼의 (−)는 움직이지 않는다는 이름표 */
  if(S.aluOn && aluT > 0.7){
    var os = (chgA * Math.min(1, (aluT-0.7)/0.3)).toFixed(2);
    g += '<text x="'+(STY.x + STY.rx + 12)+'" y="'+(STY.y + 12)+'" text-anchor="start"'
       + ' font-family="Gowun Dodum,sans-serif" font-size="13" font-weight="700"'
       + ' fill="#d8c9ae" opacity="'+os+'">스타이로폼의 −는 그대로 (부도체)</text>';
  }
  return g;
}
function plus(x, y, op){
  return '<g opacity="'+op.toFixed(2)+'"><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)
       + '" r="7" fill="#b23a30" stroke="#f7e0dc" stroke-width="1.4"/>'
       + '<line x1="'+(x-4).toFixed(1)+'" y1="'+y.toFixed(1)+'" x2="'+(x+4).toFixed(1)+'" y2="'
       + y.toFixed(1)+'" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>'
       + '<line x1="'+x.toFixed(1)+'" y1="'+(y-4).toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'
       + (y+4).toFixed(1)+'" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/></g>';
}
function chgAlu(){
  if(!S.aluOn || chgA <= 0.02) return '';
  var t = aluT < 0.5 ? 2*aluT*aluT : 1 - Math.pow(-2*aluT+2, 2)/2;   /* 부드럽게 */
  var g = '';
  /* 전자가 빠져나간 자리에 (+)가 드러난다 — 몰림이 끝나 갈수록 뚜렷해진다 */
  for(var q=0;q<PLUS_PTS.length;q++){
    var e = PLUS_PTS[q];
    g += plus(ALU_ON.x + e.x, ALU_ON.y + e.y, chgA * Math.max(0, (t-0.45)/0.55));
  }
  for(var i=0;i<ALU_PTS.length;i++){
    var p = ALU_PTS[i];
    g += minus(ALU_ON.x + p.x0 + (p.x1-p.x0)*t, ALU_ON.y + p.y0 + (p.y1-p.y0)*t, chgA);
  }
  /* 이동 중 — (−)가 위로 밀려나는 방향 화살표 */
  if(t < 0.92){
    var oa = (chgA * (1-t)).toFixed(2);
    [-56, 0, 56].forEach(function(ax){
      var x = ALU_ON.x + ax, y1 = ALU_ON.y + 11, y2 = ALU_ON.y - 15;
      g += '<g opacity="'+oa+'"><line x1="'+x+'" y1="'+y1+'" x2="'+x+'" y2="'+y2
        + '" stroke="#8fc1ef" stroke-width="2.2" stroke-linecap="round"/>'
        + '<polygon points="'+x+','+(y2-6)+' '+(x-4.5)+','+(y2+3)+' '+(x+4.5)+','+(y2+3)
        + '" fill="#8fc1ef"/></g>';
    });
  }
  /* 다 몰리면 — 어느 쪽이 어떤 전하인지 이름표 */
  if(t > 0.7){
    var ol = (chgA * Math.min(1, (t-0.7)/0.3)).toFixed(2);
    var lx = ALU_ON.x - ALU_ON.rx - 12;
    g += '<text x="'+lx+'" y="'+(ALU_ON.y-16)+'" text-anchor="end" font-family="Gowun Dodum,sans-serif"'
       + ' font-size="13.5" font-weight="700" fill="#8fc1ef" opacity="'+ol+'">먼 쪽(위)엔 −</text>'
       + '<text x="'+lx+'" y="'+(ALU_ON.y+18)+'" text-anchor="end" font-family="Gowun Dodum,sans-serif"'
       + ' font-size="13.5" font-weight="700" fill="#f0a196" opacity="'+ol+'">닿은 쪽(아래)엔 +</text>';
  }
  return g;
}
function paintChg(){
  var a = document.getElementById('chgS'), b = document.getElementById('chgA');
  if(a) a.innerHTML = chgSty();
  if(b) b.innerHTML = chgAlu();
}
/* 프레임 수가 아니라 흘러간 시간으로 움직인다 —
   전자칠판처럼 프레임이 느린 기기에서도 같은 시간에 끝나야 한다 */
var animLast = 0;
function anim(now){
  var dt = animLast ? Math.min(80, now - animLast) : 16;
  animLast = now;
  var go = false;
  if(S.aluOn && aluT < 1){ aluT = Math.min(1, aluT + dt/2800); go = true; }   /* 이동 과정이 보이게 천천히 */
  if(fading && chgA > 0){ chgA = Math.max(0, chgA - dt/650); go = true; }
  paintChg();
  if(go) requestAnimationFrame(anim); else { animRun = false; animLast = 0; }
}
function startAnim(){ if(!animRun){ animRun = true; animLast = 0; requestAnimationFrame(anim); } }

/* ═══════════════════════════════════════════════════════════
   그림 조각
   ═══════════════════════════════════════════════════════════ */
function defs(){
  return '<defs>'
  /* 어둠 · 책상 */
  + '<linearGradient id="pWall" x1="0" y1="0" x2="0" y2="1">'
  +  '<stop offset="0" stop-color="#0c0a08"/><stop offset="1" stop-color="#1b1611"/></linearGradient>'
  + '<linearGradient id="pWallOn" x1="0" y1="0" x2="0" y2="1">'
  +  '<stop offset="0" stop-color="#e6dcc6"/><stop offset="1" stop-color="#d9cbad"/></linearGradient>'
  + '<linearGradient id="pDesk" x1="0" y1="0" x2="0" y2="1">'
  +  '<stop offset="0" stop-color="#4a3624"/><stop offset=".25" stop-color="#3a2a1b"/>'
  +  '<stop offset="1" stop-color="#241a11"/></linearGradient>'
  + '<linearGradient id="pDeskOn" x1="0" y1="0" x2="0" y2="1">'
  +  '<stop offset="0" stop-color="#c69a63"/><stop offset=".25" stop-color="#b0854f"/>'
  +  '<stop offset="1" stop-color="#8e6738"/></linearGradient>'
  + '<radialGradient id="pLamp" cx=".5" cy=".5" r=".5">'
  +  '<stop offset="0" stop-color="#fff3d6" stop-opacity=".16"/>'
  +  '<stop offset="1" stop-color="#fff3d6" stop-opacity="0"/></radialGradient>'
  /* 스타이로폼 — 미세한 알갱이가 보이는 하얀 발포 */
  + '<linearGradient id="pSty" x1="0" y1="0" x2="0" y2="1">'
  +  '<stop offset="0" stop-color="#fbfaf6"/><stop offset=".55" stop-color="#e9e6dc"/>'
  +  '<stop offset="1" stop-color="#cfcabb"/></linearGradient>'
  /* 알루미늄 — 금속 띠 */
  + '<linearGradient id="pAlu" x1="0" y1="0" x2="1" y2="0">'
  +  '<stop offset="0" stop-color="#8f9298"/><stop offset=".14" stop-color="#e8ecef"/>'
  +  '<stop offset=".33" stop-color="#a9aeb4"/><stop offset=".5" stop-color="#f2f5f7"/>'
  +  '<stop offset=".68" stop-color="#9aa0a6"/><stop offset=".86" stop-color="#dfe3e7"/>'
  +  '<stop offset="1" stop-color="#83878d"/></linearGradient>'
  + '<linearGradient id="pAluRim" x1="0" y1="0" x2="0" y2="1">'

var flashStart = 0, flashDur = 0, flashing = false;
function fire(slow){
  flashStart = performance.now();
  flashDur = slow ? 1500 : 200;
  flashing = true;
  requestAnimationFrame(tick);
}
function tick(now){
  if(!flashing) return;
  var e = (now - flashStart) / flashDur;
  var b;
  if(e >= 1){ b = 0; flashing = false; }
  else if(e < 0.07) b = e / 0.07;
  else b = Math.pow(1 - (e - 0.07) / 0.93, 1.7);
  var halo = document.getElementById('nHalo');
  var core = document.getElementById('nCore');
  var sp   = document.getElementById('nSpill');
  if(halo) halo.setAttribute('opacity', (b * 0.95).toFixed(3));
  if(halo) halo.setAttribute('r', (48 + b * 30).toFixed(1));
  if(core) core.setAttribute('opacity', (b).toFixed(3));
  if(sp)   sp.setAttribute('opacity', (b * (S.dark ? 0.5 : 0.22)).toFixed(3));
  if(flashing) requestAnimationFrame(tick);
}

/* ═══════════════════════════════════════════════════════════
   끌기
   ═══════════════════════════════════════════════════════════ */
function svgPt(cx, cy){
  var m = lab.getScreenCTM(); if(!m) return null;
  var i = m.inverse();
  return { x: i.a*cx + i.c*cy + i.e, y: i.b*cx + i.d*cy + i.f };
}
var drag = null, rubbing = false, lastRubX = 0;

function hit(p){
  if((S.step === 0 || S.step === 1) && Math.abs(p.x-S.fur.x) < 84 && Math.abs(p.y-S.fur.y) < 34) return 'fur';
  if(S.step === 2 && !S.aluOn){
    /* 수수깡을 잡는다 */
    if(Math.abs(p.x-S.alu.x) < 30 && p.y > S.alu.y-96 && p.y < S.alu.y+6) return 'alu';
    if(Math.abs(p.x-S.alu.x) < ALU_ON.rx && Math.abs(p.y-S.alu.y) < ALU_ON.ry+6) return 'alu';
  }
  if(S.step === 3 && p.x > S.neon.x-24 && p.x < S.neon.x+200 && Math.abs(p.y-S.neon.y) < 40) return 'neon';
  return null;
}

lab.addEventListener('pointerdown', function(e){
  var p = svgPt(e.clientX, e.clientY); if(!p) return;
  var h = hit(p); if(!h) return;
  e.preventDefault();
  var o = h === 'fur' ? S.fur : (h === 'alu' ? S.alu : S.neon);
  drag = { what:h, dx:o.x - p.x, dy:o.y - p.y };
  if(h === 'fur'){ lastRubX = p.x; }
  try{ lab.setPointerCapture(e.pointerId); }catch(_){}
});

lab.addEventListener('pointermove', function(e){
  if(!drag) return;
  var p = svgPt(e.clientX, e.clientY); if(!p) return;
  var o = drag.what === 'fur' ? S.fur : (drag.what === 'alu' ? S.alu : S.neon);
  o.x = p.x + drag.dx; o.y = p.y + drag.dy;

  if(drag.what === 'fur' && S.step === 0){
    var onPlate = Math.abs(o.x - STY.x) < STY.rx + 20 && Math.abs(o.y - STY.y) < 66;
    rubbing = onPlate;
    if(onPlate){
      S.rub += Math.abs(p.x - lastRubX);
      if(rubPct() >= 1 && S.step === 0) ready1();
    }
    lastRubX = p.x;
  }
  var g = document.getElementById(drag.what === 'fur' ? 'gFur' : (drag.what === 'alu' ? 'gAluG' : 'gNeon'));
  if(g) g.setAttribute('transform', 'translate('+o.x+','+o.y+')');

  if(drag.what === 'fur') { draw(); }
  if(drag.what === 'neon' && S.step === 3 && S.armed){
    var d = Math.hypot(o.x - TOUCH.x, o.y - TOUCH.y);
    if(d < 46) contact();
  }
  updateTodo();
});

lab.addEventListener('pointerup', function(){
  if(!drag) return;
  var w = drag.what; drag = null; rubbing = false;
  if(w === 'alu' && S.step === 2){
    var d = Math.hypot(S.alu.x - ALU_ON.x, S.alu.y - ALU_ON.y);
    if(d < 90){
      S.aluOn = true; S.armed = true; S.step = 3; aluT = 0;
      draw(); startAnim();
      /* 전하가 다 몰린 뒤에 다음 안내를 띄운다 */
      setTimeout(function(){ fadeAfterPop = true; brief(3); }, 1200);
    }
    else { S.alu.x = ALU_HOME.x; S.alu.y = ALU_HOME.y; }
  }
  draw(); updateTodo();
});

}

   +'움직이는 것은 <b>알루미늄 접시 안에 원래 있던</b> (−)예요.' },
{ k:'4단계', t:'네온전구를 대 보기',
  b:'네온전구의 한쪽 극은 이미 <b>손으로 잡고</b> 있습니다.<br>'
   +'다른 쪽 끝을 <b>알루미늄 접시 가장자리</b>에 대 보세요.<br><br>'
   +'<b>여기서부터는 눈에 보이지 않습니다.</b><br>무슨 일이 일어나는지는 여러분이 알아내야 해요.' }
];
function brief(i){
  var m = BRIEF[i];
  openPop('<div class="kicker">'+m.k+'</div><h3>'+m.t+'</h3>'
        + '<div class="body">'+m.b+'</div>'
        + (m.o ? '<ol>'+m.o.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ol>' : '')
        + '<div class="poprow"><button class="btn primary" data-act="ok">알겠어요</button></div>');
}

function result1(){
  openPop('<div class="kicker">봤나요?</div><h3>불이 켜졌습니다</h3>'
        + '<div class="body">전지는 <b>하나도</b> 쓰지 않았습니다.<br>'
        + '그런데 네온전구가 <b>아주 잠깐</b> 켜졌어요.<br>'
        + '너무 빨라서 놓쳤다면 <b>🐢 느리게 다시 보기</b>를 눌러 보세요.</div>'
        + '<div class="qbox">🤔 전지도 없었는데 불이 켜졌습니다.<br>'
        + '그 순간, <b>무엇이 전구를 지나간 걸까요?</b></div>'
        + '<div class="qbox">🤔 그리고 왜 <b>계속 켜져 있지 않고</b> 잠깐만 켜졌을까요?</div>'
        + '<div class="nextbox">🎉 <b>① 성공!</b> 다음 실험은 <b>② 다 이었는데 안 켜진다</b> —'
        + ' 이번엔 전지도 전구도 있는데 <b>안 켜지는</b> 회로입니다.</div>'
        + '<div class="poprow"><button class="btn" data-act="ok">여기 더 있을래요</button>'
        + '<button class="btn primary" data-act="next">② 다 이었는데 안 켜진다 →</button></div>');
}

function again(){
  openPop('<div class="kicker">한 번 더</div><h3>또 켜졌습니다</h3>'
        + '<div class="body">털가죽으로는 <b>맨 처음 한 번만</b> 문질렀습니다.<br>'
        + '그런데 접시를 들었다 놓기만 하면 <b>몇 번이고</b> 다시 켜져요.</div>'
        + '<div class="qbox">🤔 문지르지도 않았는데 <b>어떻게 계속 켜질까요?</b></div>'
        + '<div class="poprow"><button class="btn primary" data-act="ok">계속 해 볼게요</button></div>');
}

/* ═══════════════════════════════════════════════════════════
   단추 · 안내
   ═══════════════════════════════════════════════════════════ */
var STEPS = ['문지르기', '뒤집어 놓기', '접시 올리기', '전구 대기'];
function drawSteps(){
  document.getElementById('steps').innerHTML = STEPS.map(function(t, i){
    var cls = (S.step > i || (i === 3 && S.lit > 0)) ? 'done' : (S.step === i ? 'now' : '');
    return '<div class="st '+cls+'"><span class="no">'+(i+1)+'</span><span>'+t+'</span></div>';
  }).join('') + (S.lit > 0 ? '<div class="st success"><span class="no">🎉</span><span>성공!</span></div>' : '');
}
function updateTodo(){
  var t;
  if(S.step === 0){
    var pct = Math.round(rubPct()*100);
    t = '<b>털가죽</b>을 끌어다 스타이로폼 접시 위에서 <b>좌우로 문지르세요.</b> ('+pct+'%)';
  }
  else if(S.step === 1) t = '<b>접시 뒤집어 놓기</b>를 누르세요.';
  else if(S.step === 2) t = '<b>수수깡</b>을 잡고 알루미늄 접시를 스타이로폼 접시 위로 옮기세요.';
  else if(S.step === 3 && S.armed) t = '네온전구 끝을 <b>알루미늄 접시 가장자리(○ 표시)</b>에 대세요.';
  else t = '✅ <b>성공!</b> 전구가 켜졌어요 — <b>접시를 들었다 다시 놓기</b>로 몇 번이고 다시, 아니면 위의 <b>② 다 이었는데 안 켜진다</b>로 넘어가세요.';
  document.getElementById('todoTx').innerHTML = t;
  document.getElementById('btnFlip').hidden = (S.step !== 1);
  drawSteps();
}
function updateCount(){
  document.getElementById('count').innerHTML = S.lit
    ? '지금까지 불이 켜진 횟수 <b>'+S.lit+'</b>번'
    : '';
}

document.getElementById('btnFlip').addEventListener('click', function(){
  S.flipped = true; S.step = 2; draw(); updateTodo(); brief(2);
});
document.getElementById('btnLift').addEventListener('click', function(){
  S.armed = true;
  S.neon.x = NEON_HOME.x; S.neon.y = NEON_HOME.y;
  draw(); updateTodo();
});
document.getElementById('btnSlow').addEventListener('click', function(){ fire(true); });
document.getElementById('btnLight').addEventListener('click', function(){
  S.dark = !S.dark;
  this.textContent = S.dark ? '💡 교실 불 켜기' : '🌙 교실 불 끄기';
  draw();
});
document.getElementById('btnReset').addEventListener('click', function(){
  S.step = 0; S.rub = 0; S.flipped = false; S.aluOn = false; S.armed = false; S.lit = 0;
  aluT = 0; chgA = 1; fading = false; fadeAfterPop = false; saidAgain = false;
  S.fur = {x:FUR_HOME.x, y:FUR_HOME.y};
  S.alu = {x:ALU_HOME.x, y:ALU_HOME.y};
  S.neon = {x:NEON_HOME.x, y:NEON_HOME.y};
  document.getElementById('btnSlow').hidden = true;
  document.getElementById('btnLift').hidden = true;
  draw(); updateTodo(); updateCount(); brief(0);
});

/* 두 번째부터는 "또 켜졌다" 안내를 한 번만 */
var saidAgain = false;
var _contact = contact;
contact = function(){
  var before = S.lit;
  _contact();
  if(before >= 1 && !saidAgain){ saidAgain = true; setTimeout(again, 950); }
};

draw(); updateTodo(); updateCount(); brief(0);

/* 검증용 훅 — 다른 시뮬의 __step 과 같은 관례 */
window.__eph = {
  state:function(){ return {step:S.step, lit:S.lit, aluT:aluT, armed:S.armed, aluOn:S.aluOn}; },
  toStep3:function(){ S.rub = RUB_NEED; S.flipped = true; S.aluOn = true; S.armed = true; S.step = 3;
    aluT = 0; draw(); updateTodo(); startAnim(); },
  touch:function(){ contact(); },
  chgHtml:function(){ return {a:document.getElementById('chgA').innerHTML,
                              s:document.getElementById('chgS').innerHTML}; },
  setT:function(v){ aluT = v; paintChg(); }
};
})();
</script>
</body>
</html>
