<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전지도 없이 전구를 켜 보자 · 3D 가상 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
 --abyss:#f2eade; --surface2:#fffcf4; --line:#c1ac82; --line-soft:#dccfae;
 --ink:#2e2315; --ink-dim:#5c4a33; --ink-mute:#96805c;
 --accent:#a05c2c; --gold:#8a5f24; --ok:#2c7a44; --neon:#ff6a2a;
 --minus:#2f78c8; --plus:#c8402f;
 --disp:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
 --jua:"Jua",var(--disp); --gowun:"Gowun Dodum",var(--disp);
 --r:16px; --shadow:0 18px 50px -22px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overscroll-behavior:none}
body{font-family:var(--disp);color:var(--ink);background:
 radial-gradient(900px 560px at 8% 6%, rgba(160,92,44,.08), transparent 60%),
 radial-gradient(700px 480px at 92% 90%, rgba(44,110,95,.07), transparent 55%),
 var(--abyss); min-height:100vh; -webkit-font-smoothing:antialiased}

header.top{padding:20px 20px 2px; text-align:center}
header.top h1{font-family:var(--jua); font-size:clamp(21px,4.2vw,32px); line-height:1.3}
header.top h1 .em{color:var(--accent)}
.wrap{max-width:980px; margin:0 auto; padding:10px 14px 40px}

.steps{display:flex; gap:7px; justify-content:center; margin:13px 0 4px; flex-wrap:wrap}
.st{display:flex; align-items:center; gap:7px; background:var(--surface2); border:1.5px solid var(--line-soft);
 border-radius:999px; padding:7px 14px 7px 10px; font-family:var(--gowun); font-size:13px;
 color:var(--ink-mute); transition:.2s}
.st .no{width:19px;height:19px;border-radius:50%;background:var(--line-soft);color:#fff;flex:none;
 display:grid;place-items:center;font-size:11.5px;font-family:var(--jua)}
.st.now{border-color:var(--accent); color:var(--accent); background:#fbf1e4; box-shadow:0 0 0 3px rgba(160,92,44,.12)}
.st.now .no{background:var(--accent)}
.st.done{border-color:var(--ok); color:var(--ok)} .st.done .no{background:var(--ok)}
.st.success{border-color:var(--ok); color:var(--ok); background:rgba(44,110,95,.14); font-weight:700;
 animation:stpop .5s} .st.success .no{background:var(--ok)}
@keyframes stpop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

#todo{margin:11px auto 0; max-width:780px; display:flex; gap:11px; align-items:center;
 background:#fbf1e4; border:1.6px solid var(--accent); border-radius:14px; padding:12px 18px;
 font-family:var(--gowun); font-size:15.5px; line-height:1.6; color:var(--ink-dim)}
#todo .ic{font-size:20px; flex:none} #todo b{color:var(--accent); font-family:var(--disp)}

.card{background:rgba(255,252,244,.82); border:1.5px solid var(--line); border-radius:var(--r);
 box-shadow:var(--shadow); overflow:hidden; margin-top:13px}
.card-h{display:flex; align-items:center; gap:9px; padding:10px 16px; border-bottom:1px dashed var(--line-soft)}
.card-h .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.card-h h2{font-family:var(--jua); font-size:16px; color:var(--gold)}
.card-h .hint{margin-left:auto; font-size:12.5px; color:var(--ink-mute); font-family:var(--gowun); text-align:right}
@media (max-width:560px){ .card-h .hint{display:none} }

/* ── 3D 무대 ── */
#stage{position:relative; width:100%; height:clamp(330px,56vw,520px); background:#0c0a08; overflow:hidden;
 user-select:none; -webkit-user-select:none}
#stage canvas{display:block; width:100% !important; height:100% !important; touch-action:none; outline:none}
#labels{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.lbl{position:absolute; left:0; top:0; white-space:nowrap; pointer-events:none;
 font-family:var(--gowun); font-size:13px; color:#d8c9ae; text-shadow:0 1px 3px rgba(0,0,0,.9);
 transition:opacity .25s; will-change:transform}
.lbl.k{font-weight:700; font-size:13.5px; padding:2px 8px; border-radius:8px; background:rgba(10,8,6,.62)}
.lbl.minus{color:#a9d0f7} .lbl.plus{color:#f6aa9c} .lbl.warn{color:#ffd28a}
.lbl.big{font-size:15px}
#stage.light .lbl{color:#4a3a26; text-shadow:0 1px 2px rgba(255,255,255,.9)}
#stage.light .lbl.k{background:rgba(255,252,244,.86)}
#stage.light .lbl.minus{color:#1f5c9e} #stage.light .lbl.plus{color:#a8321f} #stage.light .lbl.warn{color:#8a5f24}

.sbtn{position:absolute; top:10px; z-index:5; font-family:var(--gowun); font-size:12.5px; padding:6px 10px;
 border-radius:9px; border:1px solid rgba(255,255,255,.28); background:rgba(20,16,12,.62); color:#f3e6cf; cursor:pointer}
.sbtn:hover{background:rgba(40,30,20,.85)}
#camReset{right:10px} #fsBtn{right:122px}
#stage.light .sbtn{background:rgba(255,252,244,.85); color:var(--ink-dim); border-color:var(--line)}

#tally{position:absolute; left:10px; top:10px; z-index:4; background:rgba(14,11,8,.78); color:#f1e4cc;
 border:1px solid rgba(255,255,255,.18); border-radius:11px; padding:8px 11px; font-family:var(--gowun);
 font-size:12.5px; line-height:1.55; pointer-events:none}
#tally b{font-family:var(--jua); font-weight:400}
#tally .row{display:flex; gap:8px; justify-content:space-between}
#tally .n{font-family:var(--jua)} #tally .m{color:#9cc8f5} #tally .p{color:#f4a497}
#tally .net{min-width:46px; text-align:right; font-family:var(--jua)}
#tally .t{font-size:11.5px; opacity:.75; margin-bottom:2px}
#stage.light #tally{background:rgba(255,252,244,.9); color:var(--ink); border-color:var(--line)}
#stage.light #tally .m{color:#1f5c9e} #stage.light #tally .p{color:#a8321f}
#legend{padding:7px 14px; font-family:var(--gowun); font-size:13px; line-height:1.55; color:var(--ink-dim);
 border-top:1px dashed var(--line-soft); background:rgba(255,252,244,.9)}
#legend i{display:inline-block; width:13px; height:13px; border-radius:50%; vertical-align:-2px; margin-right:3px;
 color:#fff; font-style:normal; font-size:11px; line-height:13px; text-align:center; font-weight:700}
#legend .lm{background:var(--minus)} #legend .lp{background:var(--plus)}

#cap{position:absolute; left:12px; right:12px; bottom:58px; z-index:6; background:rgba(16,12,9,.86);
 color:#fff3dc; border:1px solid rgba(255,200,140,.35); border-radius:13px; padding:10px 15px;
 font-family:var(--gowun); font-size:15.5px; line-height:1.6; box-shadow:0 10px 30px -10px rgba(0,0,0,.6);
 transition:opacity .25s}
#cap b{color:#ffcf8f; font-family:var(--disp)}
#cap .no{display:inline-block; font-family:var(--jua); color:#ffb066; margin-right:6px}
#stage.light #cap{background:rgba(255,252,244,.95); color:var(--ink); border-color:var(--accent)}
#stage.light #cap b{color:var(--accent)}
#playbar{position:absolute; left:0; right:0; bottom:0; z-index:6; display:flex; gap:7px; justify-content:center;
 align-items:center; padding:9px; background:linear-gradient(transparent, rgba(0,0,0,.6))}
.pb{font-family:var(--jua); font-size:14px; padding:7px 13px; border-radius:10px; border:1.5px solid rgba(255,255,255,.35);
 background:rgba(20,16,12,.78); color:#fff3dc; cursor:pointer}
.pb:hover{border-color:#ffb066}
.pb.on{background:#a05c2c; border-color:#a05c2c}
#pbDots{display:flex; gap:5px; margin:0 4px}
#pbDots span{width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.3)}
#pbDots span.on{background:#ffb066} #pbDots span.done{background:rgba(255,176,102,.55)}
#cap[hidden], #playbar[hidden], #tally[hidden], #legend[hidden]{display:none}
#stage.narrow #cap{font-size:13.5px; line-height:1.5; padding:7px 10px; left:8px; right:8px; bottom:50px}
#stage.narrow #tally{font-size:11px; padding:5px 8px} #stage.narrow .sbtn{font-size:11.5px; padding:5px 8px}
#stage.narrow #fsBtn{right:100px} #stage.narrow .pb{font-size:13px; padding:6px 9px}
#noGL{position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:30px;
 color:#f1e4cc; font-family:var(--gowun); font-size:15px; line-height:1.7}
#noGL[hidden]{display:none}

.acts{display:flex; gap:9px; flex-wrap:wrap; justify-content:center; margin-top:14px}
.btn{font-family:var(--jua); font-size:15.5px; padding:11px 20px; border-radius:12px; cursor:pointer;
 border:1.8px solid var(--line); background:var(--surface2); color:var(--ink-dim); transition:.15s}
.btn:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent); color:#fdf6e8; border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08); color:#fdf6e8}
.btn.ask{background:#2c6e5f; border-color:#2c6e5f; color:#f2fbf7}
.btn.ask:hover:not(:disabled){filter:brightness(1.1); color:#fff}
.btn.pulse{animation:bpulse 1.2s infinite}
@keyframes bpulse{0%,100%{box-shadow:0 0 0 0 rgba(44,110,95,.55)}55%{box-shadow:0 0 0 11px rgba(44,110,95,0)}}
.btn:disabled{opacity:.36; cursor:not-allowed}
.btn[hidden]{display:none}
.nextbox{margin-top:12px; padding:12px 15px; border-radius:12px; background:rgba(44,110,95,.13);
 border:1.5px solid var(--ok); font-family:var(--gowun); font-size:14.5px; line-height:1.65}

#count{margin:13px auto 0; max-width:740px; text-align:center; font-family:var(--gowun);
 font-size:15px; color:var(--ink-dim)}
#count b{font-family:var(--jua); font-size:19px; color:var(--neon)}

/* ── 답 찾기 ── */
#ansHead{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; background:#eaf4f0;
 border:1.6px solid #2c6e5f; border-radius:14px; padding:9px 12px}
#ansHead[hidden]{display:none}
#ansHead .t{font-family:var(--jua); font-size:17px; color:#1f5c4f; margin-right:auto}
#ansHead .t small{font-family:var(--gowun); font-size:13px; color:#3d6b60; margin-left:6px}
#ansHead .btn{font-size:14px; padding:8px 14px}
#grid{display:block}
body.ans #grid{display:grid; grid-template-columns:minmax(0,1.42fr) minmax(280px,1fr); gap:12px; align-items:start}
body.ans #labUI, body.ans #acts, body.ans #count{display:none}
@media (max-width:780px){ body.ans #grid{display:block} }
#ansPanel{margin-top:13px; background:rgba(255,252,244,.94); border:1.5px solid #2c6e5f; border-radius:var(--r);
 box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden}
#ansPanel[hidden]{display:none}
.ap-search{display:flex; gap:7px; padding:11px 12px 8px; border-bottom:1px dashed var(--line-soft)}
.ap-search input{flex:1; min-width:0; font-family:var(--gowun); font-size:15px; padding:9px 11px; border-radius:10px;
 border:1.5px solid var(--line); background:#fff; color:var(--ink)}
.ap-search input:focus{outline:none; border-color:#2c6e5f; box-shadow:0 0 0 3px rgba(44,110,95,.15)}
.ap-search button{font-family:var(--jua); font-size:14.5px; padding:0 14px; border-radius:10px; border:1.5px solid #2c6e5f;
 background:#2c6e5f; color:#fff; cursor:pointer}
#qMsg{font-family:var(--gowun); font-size:13.5px; color:#2c6e5f; padding:6px 13px 0; line-height:1.5}
#qMsg:empty{display:none}
.ap-scroll{overflow-y:auto; padding:10px 12px 14px; flex:1; min-height:0}
#ansCard{background:#fff; border:1.5px solid var(--line); border-radius:13px; padding:13px 15px 12px; margin-bottom:12px}
#ansCard .k{font-family:var(--jua); font-size:12.5px; color:#2c6e5f}
#ansCard h3{font-family:var(--jua); font-size:18px; line-height:1.4; margin:2px 0 7px; color:var(--ink)}
#ansCard p{font-family:var(--gowun); font-size:15px; line-height:1.72; color:var(--ink-dim); margin-top:6px}
#ansCard p b{color:var(--ink); font-family:var(--disp)}
#ansCard ol{font-family:var(--gowun); font-size:15px; line-height:1.7; color:var(--ink-dim); margin:6px 0 0 20px}
#ansCard ol b{color:var(--ink); font-family:var(--disp)}
#ansCard .core{margin-top:10px; padding:8px 11px; border-radius:10px; background:#fbf1e4; border:1.3px solid var(--accent);
 font-family:var(--gowun); font-size:14.5px; color:var(--ink)}
#ansCard .core b{color:var(--accent)}
#ansCard .play{margin-top:10px; font-family:var(--jua); font-size:14px; padding:7px 13px; border-radius:10px;
 border:1.5px solid #2c6e5f; background:#eaf4f0; color:#1f5c4f; cursor:pointer}
#ansCard table{width:100%; border-collapse:collapse; margin-top:8px; font-family:var(--gowun); font-size:13.5px}
#ansCard th,#ansCard td{border:1px solid var(--line-soft); padding:5px 7px; text-align:left; vertical-align:top; line-height:1.5}
#ansCard th{background:#f5ecda; font-family:var(--jua); font-weight:400; color:var(--gold)}
.qall{display:block; width:100%; text-align:left; font-family:var(--jua); font-size:15px; padding:11px 13px; border-radius:12px;
 border:1.6px solid var(--accent); background:#fbf1e4; color:var(--accent); cursor:pointer; margin-bottom:10px}
.qall.on{background:var(--accent); color:#fff}
.qg-t{font-family:var(--jua); font-size:13.5px; color:var(--gold); margin:10px 2px 6px}
.qchips{display:flex; flex-direction:column; gap:6px}
.qc{text-align:left; font-family:var(--gowun); font-size:14.5px; line-height:1.45; padding:8px 11px; border-radius:10px;
 border:1.4px solid var(--line-soft); background:#fff; color:var(--ink-dim); cursor:pointer; transition:.15s}
.qc:hover{border-color:#2c6e5f; color:#1f5c4f}
.qc.on{border-color:#2c6e5f; background:#2c6e5f; color:#fff}
.qc.hit{border-color:#e08a2c; box-shadow:0 0 0 3px rgba(224,138,44,.22); background:#fff8ec}
.qc.hit.on{background:#2c6e5f}
.ap-foot{font-family:var(--gowun); font-size:13px; color:var(--ink-mute); line-height:1.6; margin-top:12px; padding-top:9px;
 border-top:1px dashed var(--line-soft)}

#pop{position:fixed; inset:0; z-index:120; display:none; align-items:center; justify-content:center;
 background:rgba(20,14,8,.62); padding:20px}
#pop.on{display:flex}
.popbox{background:#fffdf6; border:2px solid var(--line); border-radius:20px; max-width:520px; width:100%;
 padding:25px 26px 21px; box-shadow:0 30px 70px -20px rgba(0,0,0,.6); text-align:center;
 max-height:88vh; overflow-y:auto}
@media (prefers-reduced-motion:no-preference){ #pop.on .popbox{animation:popIn .22s cubic-bezier(.2,1.1,.4,1) both} }
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.popbox .kicker{font-family:var(--jua); font-size:13.5px; color:var(--accent)}
.popbox h3{font-family:var(--jua); font-size:22px; margin-top:5px; line-height:1.35}
.popbox .body{font-family:var(--gowun); font-size:16px; line-height:1.75; color:var(--ink-dim); margin-top:13px}
.popbox .body b{color:var(--ink); font-family:var(--disp)}
.popbox ol{text-align:left; margin:12px 4px 0 22px; font-family:var(--gowun); font-size:15.5px;
 line-height:1.8; color:var(--ink-dim)}
.popbox .small{font-family:var(--gowun); font-size:13.5px; color:var(--ink-mute); margin-top:10px; line-height:1.6}
.poprow{display:flex; gap:10px; justify-content:center; margin-top:19px; flex-wrap:wrap}
.qbox{margin-top:16px; padding:15px 18px; border-radius:14px; border:1.6px solid var(--accent);
 background:rgba(160,92,44,.07); font-family:var(--gowun); font-size:16.5px; line-height:1.65}
.qbox b{color:var(--accent); font-family:var(--disp)}
.qbox + .qbox{margin-top:10px; border-style:dashed; font-size:15.5px}

.backline{margin-top:22px; text-align:center}
.backline a{display:inline-flex; align-items:center; gap:8px; text-decoration:none; font-family:var(--jua);
 font-size:15px; color:var(--ink-dim); background:var(--surface2); border:1.5px solid var(--line);
 border-radius:12px; padding:11px 22px; transition:.15s}
.backline a:hover{border-color:var(--accent); color:var(--accent)}

#app-credit{width:100%;box-sizing:border-box;margin:2.5rem 0 0;padding:14px 12px;text-align:center;font-size:15px;
 line-height:1.6;color:#8a755c;font-family:system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;
 border-top:1px solid rgba(128,128,128,.25)}

/* 전체 화면 */
.stagecard:fullscreen{border-radius:0; margin:0; display:flex; flex-direction:column; background:#0c0a08}
.stagecard:fullscreen #stage{height:auto; flex:1}

/* 수업 페이지 안에 끼워 넣을 때 — 제목·푸터·돌아가기를 감춘다 */
html.embed body{background:none}
html.embed header.top, html.embed .backline, html.embed #app-credit{display:none}
html.embed .wrap{padding:4px 12px 12px; max-width:none}
html.embed .card{box-shadow:none}
html.embed #stage{height:clamp(320px,50vw,440px)}

/* 갤러리 썸네일용 — 실험판만 화면 가득 (?thumb=1) */
html.thumb header.top, html.thumb #labUI, html.thumb #ansHead, html.thumb #acts, html.thumb #count,
html.thumb .backline, html.thumb #app-credit, html.thumb .card-h, html.thumb #legend, html.thumb .sbtn,
html.thumb #labels, html.thumb #tally, html.thumb #pop{display:none !important}
html.thumb body{background:#0c0a08}
html.thumb .wrap{padding:0; max-width:none}
html.thumb .card{margin:0; border:0; border-radius:0; box-shadow:none}
html.thumb #stage{height:100vh !important}
html.embed body.ans #stage{height:clamp(320px,52vw,470px)}
</style>

<body>

<header class="top">
  <h1>전지도 없이 <span class="em">전구를 켜 보자</span></h1>
</header>

<div class="wrap">
  <div id="labUI">
    <div class="steps" id="steps"></div>
    <div id="todo"><span class="ic">👉</span><span id="todoTx">준비 중…</span></div>
  </div>

  <div id="ansHead" hidden>
    <span class="t">🔎 내 질문의 답 찾기<small>전자가 보이는 3D로 숨은 과정을 보여 줘요</small></span>
    <button class="btn" id="btnFree">🧪 전자 보며 직접 다시 해 보기</button>
    <button class="btn" id="btnBack">← 실험으로 돌아가기</button>
  </div>

  <div id="grid">
    <div class="card stagecard" id="stageCard">
      <div class="card-h"><span class="dot"></span><h2>3D 실험대</h2>
        <span class="hint" id="stageHint">도구를 끌어다 옮기세요 · 빈 곳을 끌면 돌려 볼 수 있어요</span></div>
      <div id="stage">
        <div id="labels"></div>
        <div id="tally" hidden></div>
        <button class="sbtn" id="camReset" type="button">⌖ 처음 시점</button>
        <button class="sbtn" id="fsBtn" type="button">⛶ 크게 보기</button>
        <div id="cap" hidden></div>
        <div id="playbar" hidden>
          <button class="pb" id="pbPrev" type="button">⏮</button>
          <button class="pb" id="pbReplay" type="button">⟲ 다시 보기</button>
          <div id="pbDots"></div>
          <button class="pb" id="pbSlow" type="button">🐢 느리게</button>

<script>
"use strict";
(function(){

var EMBED = /[?&]embed=1/.test(location.search);
if(EMBED) document.documentElement.classList.add('embed');
var THUMB = /[?&]thumb=1/.test(location.search);   /* 갤러리 썸네일 찍기 */
if(THUMB) document.documentElement.classList.add('thumb');
function $(id){ return document.getElementById(id); }
var stageEl = $('stage');

/* ═══════════════════════════════════════════════════════════
   모형의 약속 (화면 뒤 계산)
   · 전하 알갱이 하나 = 실제로는 셀 수 없이 많은 전하 묶음
   · 털가죽 → 스타이로폼으로 옮겨 가는 것은 전자(−)뿐 — (+)는 움직이지 않는다
   · 스타이로폼은 부도체: 문질러 생긴 (−)는 제자리에 붙어 있다(알루미늄으로 넘어가지 않음)
   · 알루미늄은 도체: 자유 전자만 움직이고 (+)는 제자리
   · 정전기 유도의 세기 A = round(스타이로폼 (−) 수 × 가까움 k)
       k = 1/(1+(h/0.2)²) × 겹침 — 맞닿으면 1, 들어 올리면 0 에 가깝다
       뒤집지 않으면(문지른 면이 책상 쪽) k × 0.42 — 멀고 책상 쪽을 향해 약해진다
   · 손(몸)과 이어지면 접시의 남는 전하 q 가 A 와 같아질 때까지 전자가 오간다(q→A)
       q < A → 남는 전자가 손 쪽으로 나간다 / q > A → 손 쪽에서 전자가 들어온다
   · 네온전구는 전자가 지나가는 동안만 빛나고, 전자가 밖에서 들어오는 쪽 전극 둘레가 빛난다
   ═══════════════════════════════════════════════════════════ */

if(!window.THREE){ $('noGL').hidden = false; return; }
var renderer;
try{ renderer = new THREE.WebGLRenderer({antialias:true}); }
catch(err){ $('noGL').hidden = false; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stageEl.insertBefore(renderer.domElement, stageEl.firstChild);

function V(x,y,z){ return new THREE.Vector3(x,y,z); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function ease(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
function lerp(a,b,t){ return a+(b-a)*t; }
var seed = 20261004;
function rnd(){ seed = (seed*1664525 + 1013904223) % 4294967296; return seed/4294967296; }

var scene = new THREE.Scene();
var cam = new THREE.PerspectiveCamera(36, 16/9, 0.03, 80);
var CAMS = {
  start: {p:V(0.85, 2.55, 4.75), t:V(0.35, 0.5, 0.05)},
  held:  {p:V(0.75, 2.05, 4.75), t:V(0.25, 0.8, -0.05)},

};
cam.position.copy(CAMS.start.p);

ctl.target.copy(CAMS.start.t);
ctl.enableDamping = true; ctl.dampingFactor = .12; ctl.enablePan = false;
ctl.minDistance = 0.8; ctl.maxDistance = 9; ctl.maxPolarAngle = 1.52;
ctl.update();

/* ── 빛 ── */
var hemi = new THREE.HemisphereLight(0xfff1dc, 0x2a1f15, .5); scene.add(hemi);

key.position.set(-2.4, 6, 3.6); key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.left = -4; key.shadow.camera.right = 4; key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
key.shadow.camera.near = .5; key.shadow.camera.far = 16; key.shadow.bias = -0.0008;
scene.add(key);
var fill = new THREE.DirectionalLight(0xbfd4ff, .22); fill.position.set(4, 3, -3); scene.add(fill);

/* ── 질감 ── */
function canvasTex(w,h,draw){
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  var t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
var TEX = {
  wood: canvasTex(1024,512,function(g,w,h){
    g.fillStyle = '#7d5834'; g.fillRect(0,0,w,h);
    for(var i=0;i<110;i++){
      var y = rnd()*h;
      g.strokeStyle = 'rgba('+(40+rnd()*40|0)+','+(22+rnd()*20|0)+',10,'+(.10+rnd()*.2).toFixed(2)+')';
      g.lineWidth = 1+rnd()*3; g.beginPath(); g.moveTo(0,y);
      for(var x=0;x<=w;x+=24) g.lineTo(x, y+Math.sin(x*.009+i)*4+Math.sin(x*.0027+i*1.7)*9);
      g.stroke();
    }
  }),
  foam: canvasTex(256,256,function(g,w,h){
    g.fillStyle = '#f4f2ec'; g.fillRect(0,0,w,h);
    for(var i=0;i<1400;i++){
      var x=rnd()*w, y=rnd()*h, r=1+rnd()*2.6;
      g.fillStyle = rnd()<.5 ? 'rgba(255,255,255,.9)' : 'rgba(200,196,184,.35)';
      g.beginPath(); g.arc(x,y,r,0,7); g.fill();
    }
  }),
  stick: canvasTex(64,256,function(g,w,h){
    g.fillStyle = '#dcc68e'; g.fillRect(0,0,w,h);
    for(var i=0;i<9;i++){ g.fillStyle = 'rgba(150,118,60,.35)'; g.fillRect(i*7+rnd()*3, 0, 1.5, h); }
    for(var j=0;j<3;j++){ g.fillStyle = 'rgba(160,128,70,.45)'; g.fillRect(0, 40+j*80, w, 3); }
  }),
  fur: canvasTex(256,128,function(g,w,h){
    g.fillStyle = '#5e4027'; g.fillRect(0,0,w,h);
    for(var i=0;i<900;i++){
      var x=rnd()*w, y=rnd()*h;
      g.strokeStyle = 'rgba('+(120+rnd()*60|0)+','+(85+rnd()*40|0)+',50,.5)';
      g.lineWidth = 1; g.beginPath(); g.moveTo(x,y); g.lineTo(x+rnd()*4-2, y+5+rnd()*6); g.stroke();
    }
  }),
  glow: canvasTex(128,128,function(g){
    var gr = g.createRadialGradient(64,64,0,64,64,64);
    gr.addColorStop(0,'rgba(255,236,200,1)'); gr.addColorStop(.25,'rgba(255,150,70,.9)');
    gr.addColorStop(.6,'rgba(255,80,20,.35)'); gr.addColorStop(1,'rgba(255,60,0,0)');
    g.fillStyle = gr; g.fillRect(0,0,128,128);
  }),
  ring: canvasTex(128,128,function(g){
    g.strokeStyle = 'rgba(255,214,120,.95)'; g.lineWidth = 9; g.beginPath(); g.arc(64,64,50,0,7); g.stroke();
  }),
  minus: chargeTex(-1), plus: chargeTex(1)
};
TEX.wood.wrapS = TEX.wood.wrapT = THREE.RepeatWrapping; TEX.wood.repeat.set(1.6,1);
function chargeTex(sign){
  return canvasTex(128,128,function(g){
    g.beginPath(); g.arc(64,64,54,0,7);
    g.fillStyle = sign<0 ? '#2f78c8' : '#c8402f'; g.fill();
    g.lineWidth = 8; g.strokeStyle = 'rgba(255,255,255,.92)'; g.stroke();
    g.strokeStyle = '#fff'; g.lineWidth = 13; g.lineCap = 'round'; g.beginPath();
    g.moveTo(36,64); g.lineTo(92,64); if(sign>0){ g.moveTo(64,36); g.lineTo(64,92); }
    g.stroke();
  });
}
/* 금속이 빛을 받아 보이도록 — 간단한 둘레 그림 */
var ENV = (function(){
  function face(top, bot){
    var c = document.createElement('canvas'); c.width = c.height = 64;
    var g = c.getContext('2d'), gr = g.createLinearGradient(0,0,0,64);
    gr.addColorStop(0, top); gr.addColorStop(.55, '#8f877c'); gr.addColorStop(1, bot);
    g.fillStyle = gr; g.fillRect(0,0,64,64); return c;
  }
  var side = face('#fff6e6','#2b241d');
  var up = document.createElement('canvas'); up.width = up.height = 64;
  var ug = up.getContext('2d'); ug.fillStyle = '#fffaf0'; ug.fillRect(0,0,64,64);
  var dn = document.createElement('canvas'); dn.width = dn.height = 64;
  var dg = dn.getContext('2d'); dg.fillStyle = '#3a2c1e'; dg.fillRect(0,0,64,64);
  var t = new THREE.CubeTexture([side, side, up, dn, side, side]); t.needsUpdate = true; return t;
})();

var M = {
  desk:  new THREE.MeshStandardMaterial({map:TEX.wood, roughness:.8}),
  wall:  new THREE.MeshStandardMaterial({color:0x1b1612, roughness:1}),
  foam:  new THREE.MeshStandardMaterial({color:0xf3f1ea, roughness:.93, side:THREE.DoubleSide}),
  alu:   new THREE.MeshStandardMaterial({color:0xd9dde2, metalness:.85, roughness:.3, envMap:ENV, envMapIntensity:1, side:THREE.DoubleSide}),
  stick: new THREE.MeshStandardMaterial({color:0xdcc68e, map:TEX.stick, roughness:.85}),
  tape:  new THREE.MeshStandardMaterial({color:0xf3f1ea, roughness:.5}),
  skin:  new THREE.MeshStandardMaterial({color:0xe3b18b, roughness:.62}),
  sleeve:new THREE.MeshStandardMaterial({color:0x2d3f63, roughness:.85}),
  lead:  new THREE.MeshStandardMaterial({color:0xcfd2d6, metalness:.8, roughness:.28, envMap:ENV}),
  glass: new THREE.MeshStandardMaterial({color:0xeef3f6, transparent:true, opacity:.26, roughness:.08, depthWrite:false}),
  seal:  new THREE.MeshStandardMaterial({color:0xa8b0a0, transparent:true, opacity:.7, roughness:.3}),
  elec:  new THREE.MeshStandardMaterial({color:0x8d9399, metalness:.7, roughness:.4}),
  fur:   new THREE.MeshStandardMaterial({map:TEX.fur, roughness:1}),
  hair:  new THREE.MeshStandardMaterial({color:0x8a6640, roughness:1})
};

/* ── 책상 · 벽 ── */
var desk = new THREE.Mesh(new THREE.BoxGeometry(9.5, .16, 5.4), M.desk);
desk.position.set(.3, -.08, 0); desk.receiveShadow = true; scene.add(desk);
var wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), M.wall);
wall.position.set(0, 5, -2.75); scene.add(wall);

/* ═══════════════════════════════════════════════════════════
   스타이로폼 접시 — 원점 = 바깥 바닥면 가운데 (바로 놓으면 바닥면이 책상에 닿는다)
   ═══════════════════════════════════════════════════════════ */
var FOAM_C = V(-0.35, 0, 0);
var foamG = new THREE.Group(); scene.add(foamG);
(function(){
  var pts = [[0.001,0],[0.2,0],[0.4,0],[0.6,0],[0.78,0],[0.82,0.006],[1.17,0.18],[1.25,0.2],[1.245,0.213],[1.2,0.214],
             [1.13,0.197],[0.8,0.031],[0.76,0.025],[0.001,0.025]].map(function(p){ return new THREE.Vector2(p[0],p[1]); });
  var m = new THREE.Mesh(new THREE.LatheGeometry(pts, 72), M.foam);
  m.castShadow = true; m.receiveShadow = true; foamG.add(m);
})();
/* 문지른 자리 윤 */
var rubSheen = new THREE.Mesh(new THREE.CircleGeometry(.74, 48),
  new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0, depthWrite:false}));
rubSheen.rotation.x = Math.PI/2; rubSheen.position.y = -0.002; foamG.add(rubSheen);

var Q_HELD = new THREE.Quaternion().setFromUnitVectors(V(0,-1,0), V(0.28,0.42,0.86).normalize());
var Q_FLIP = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI,0,0));
var Q_UP = new THREE.Quaternion();
var POSE_HELD = V(-0.5, 1.32, -0.55);
function foamTo(kind){
  if(kind === 'held'){ foamG.position.copy(POSE_HELD); foamG.quaternion.copy(Q_HELD); }
  else if(kind === 'flipped'){ foamG.position.set(FOAM_C.x, 0.2, FOAM_C.z); foamG.quaternion.copy(Q_FLIP); }
  else { foamG.position.set(FOAM_C.x, 0, FOAM_C.z); foamG.quaternion.copy(Q_UP); }
  foamG.updateMatrixWorld(true);
}

/* ═══════════════════════════════════════════════════════════
   손 — 원점 = 엄지와 검지가 집는 곳, 팔은 +x 쪽(조금 위)으로 뻗는다
   ═══════════════════════════════════════════════════════════ */
var HAND_PATH = [V(0,0,0), V(.07,.04,-.02), V(.2,.06,0), V(.34,.1,0), V(.72,.25,0), V(1.12,.4,0)];
function makeHand(){
  var g = new THREE.Group();
  function seg(a,b,r,mat){
    var len = a.distanceTo(b);
    var c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 10), mat || M.skin);
    c.position.copy(a).add(b).multiplyScalar(.5);
    c.quaternion.setFromUnitVectors(V(0,1,0), b.clone().sub(a).normalize());
    c.castShadow = true; g.add(c);
    var s1 = new THREE.Mesh(new THREE.SphereGeometry(r,10,8), mat || M.skin); s1.position.copy(a); g.add(s1);
    var s2 = s1.clone(); s2.position.copy(b); g.add(s2);
  }
  var palm = new THREE.Mesh(new THREE.SphereGeometry(1,20,14), M.skin);
  palm.scale.set(.15,.058,.125); palm.position.set(.22,.06,0); palm.rotation.z = -.28; palm.castShadow = true; g.add(palm);
  seg(V(.1,.088,-.075), V(.04,.07,-.045), .022); seg(V(.04,.07,-.045), V(.005,.013,-.008), .019);   /* 검지 */
  seg(V(.1,.088,-.025), V(.045,.05,-.022), .022); seg(V(.045,.05,-.022), V(.07,-.004,-.022), .02);  /* 가운뎃손가락(굽힘) */
  seg(V(.105,.083,.025), V(.052,.046,.025), .021); seg(V(.052,.046,.025), V(.075,-.003,.025), .019);
  seg(V(.112,.078,.07), V(.066,.042,.07), .018); seg(V(.066,.042,.07), V(.086,.002,.07), .016);
  seg(V(.2,.0,-.1), V(.085,-.022,-.06), .026); seg(V(.085,-.022,-.06), V(.006,-.011,-.009), .021);  /* 엄지 */
  seg(V(.33,.085,0), V(.8,.255,0), .068);                                                            /* 팔 */
  seg(V(.76,.24,0), V(1.25,.43,0), .088, M.sleeve);                                                  /* 소매 */
  g.traverse(function(o){ o.userData.handPart = true; });
  return g;
}
function aimHand(h, dir){ h.quaternion.setFromUnitVectors(V(1,0,0), dir.clone().normalize()); }

/* 접시를 든 손 (문지를 때) */
var handFoam = makeHand(); foamG.add(handFoam);
handFoam.position.set(-1.26, 0.1, 0); aimHand(handFoam, V(-1, -0.15, 0.25));

/* ═══════════════════════════════════════════════════════════
   알루미늄 접시 + 수수깡 — 원점 = 바닥 가운데
   ═══════════════════════════════════════════════════════════ */
var PAN = {rF:.72, rR:.98, H:.28};
var PAN_HOME = V(1.95, 0.003, -0.45), CARRY_Y = 0.62, LIFT_Y = 1.15;
var PLACED_Y = 0.2 + 0.006, PLACED_Y_IN = 0.032;
var panG = new THREE.Group(); scene.add(panG);
var panMeshes = [];
(function(){
  var pts = [[0.001,0],[0.7,0],[0.722,0.01],[0.975,0.268],[0.99,0.282]].map(function(p){ return new THREE.Vector2(p[0],p[1]); });
  var geo = new THREE.LatheGeometry(pts, 120);
  var pos = geo.attributes.position;
  for(var i=0;i<pos.count;i++){
    var x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    if(y > 0.012){ var a = Math.atan2(z,x); var f = 1 + 0.014*Math.sin(a*48)*Math.min(1,(y-0.012)/0.05); pos.setXYZ(i, x*f, y, z*f); }
  }
  geo.computeVertexNormals();
  var m = new THREE.Mesh(geo, M.alu); m.castShadow = true; m.receiveShadow = true; panG.add(m); panMeshes.push(m);
  var rim = new THREE.Mesh(new THREE.TorusGeometry(.99, .014, 8, 120), M.alu);
  rim.rotation.x = Math.PI/2; rim.position.y = .284; panG.add(rim); panMeshes.push(rim);
  var stick = new THREE.Mesh(new THREE.CylinderGeometry(.045, .048, .95, 14), M.stick);
  stick.position.y = .479; stick.castShadow = true; panG.add(stick); panMeshes.push(stick);
  var band = new THREE.Mesh(new THREE.CylinderGeometry(.056,.056,.06,14), M.tape); band.position.y = .04; panG.add(band); panMeshes.push(band);
  [0, Math.PI/2].forEach(function(r){
    var t = new THREE.Mesh(new THREE.BoxGeometry(.3,.006,.055), M.tape); t.position.y = .006; t.rotation.y = r; panG.add(t); panMeshes.push(t);
  });
})();
panMeshes.forEach(function(m){ m.userData.grab = 'pan'; });
var handStick = makeHand(); panG.add(handStick);
handStick.position.set(0, .86, 0); aimHand(handStick, V(.62,.5,-.55)); handStick.visible = false;
var handPan = makeHand(); panG.add(handPan);
var GRIP_A = -0.75;   /* 맨손으로 잡을 때 쥐는 가장자리 자리(각도) */
handPan.position.set(.995*Math.cos(GRIP_A), .29, .995*Math.sin(GRIP_A));
aimHand(handPan, V(Math.cos(GRIP_A), .55, Math.sin(GRIP_A))); handPan.visible = false;

/* ═══════════════════════════════════════════════════════════
   털가죽
   ═══════════════════════════════════════════════════════════ */
var FUR_HOME = V(1.75, 0.035, 1.3);
var furG = new THREE.Group(); scene.add(furG);
var furMeshes = [];
(function(){
  var base = new THREE.Mesh(new THREE.BoxGeometry(.62,.06,.42), M.fur); base.castShadow = true; furG.add(base); furMeshes.push(base);
  var hg = new THREE.ConeGeometry(.012, .06, 4); hg.translate(0,.03,0);
  var hair = new THREE.InstancedMesh(hg, M.hair, 300);
  var o = new THREE.Object3D();
  for(var i=0;i<300;i++){
    o.position.set(-.3+rnd()*.6, .028, -.2+rnd()*.4);
    o.rotation.set((rnd()-.5)*.7, rnd()*3, (rnd()-.5)*.7); o.updateMatrix(); hair.setMatrixAt(i, o.matrix);
  }
  furG.add(hair); furMeshes.push(hair);
})();
furMeshes.forEach(function(m){ m.userData.grab = 'fur'; });
var Q_FURHOME = new THREE.Quaternion();
function furHomeNow(){ furG.position.copy(FUR_HOME); furG.quaternion.copy(Q_FURHOME); }

/* ═══════════════════════════════════════════════════════════

var FLOOR_ORDER = [0,4,6,1,3,7,2,5], WALL_ORDER = [8,11,9,12,10,13], FLOOR_OUT = [3,4,5,6,7,0,1,2];

/* 접시의 남는 전하 q 와 유도 세기 A 로 전자 자리를 정한다 */
function panLayout(q, A){

  for(i=0;i<FLOOR_OUT.length && Y>0;i++){ if(!expo[FLOOR_OUT[i]]){ expo[FLOOR_OUT[i]] = true; Y--; } }

var FLOWS = [];
function runFlow(list){   /* list: [{part, frame, pts(frame 좌표), delay, fadeIn, fadeOut, tube:[s0,s1], sC, panStart, end}] */
  return new Promise(function(res, rej){
    var f = {n:list.length, res:res, rej:rej};
    if(!list.length){ res(); return; }
    FLOWS.push(f);
    list.forEach(function(o){
      var p = o.part, wp = p.sp.getWorldPosition(V(0,0,0));
      o.frame.add(p.sp); p.owner = o.frame;
      var start = o.frame.worldToLocal(wp.clone());
      var path = [start].concat(o.pts), cum = [0];
      for(var i=1;i<path.length;i++) cum.push(cum[i-1] + path[i].distanceTo(path[i-1]));
      p.glide = null;
      p.flow = {path:path, cum:cum, L:cum[cum.length-1], s:0, delay:o.delay||0, v:o.v||1.5,
                fadeIn:o.fadeIn||0, fadeOut:o.fadeOut||0, tube:o.tube||null, sC:o.sC, panStart:!!o.panStart,
                end:o.end, grp:f};
      p.dim = false;
      if(o.fadeIn) p.fade = 0;
    });
  });
}
function flowStep(p, sdt){
  var F = p.flow;
  if(F.delay > 0){ F.delay -= sdt; return; }
  F.s = Math.min(F.L, F.s + F.v*sdt);
  var i = 1; while(i < F.cum.length-1 && F.cum[i] < F.s) i++;
  var a = F.path[i-1], b = F.path[i], seg = (F.cum[i]-F.cum[i-1]) || 1;
  p.sp.position.copy(a).lerp(b, clamp((F.s-F.cum[i-1])/seg, 0, 1));
  if(F.fadeIn) p.fade = clamp(F.s / F.fadeIn, 0, 1);
  if(F.fadeOut) p.fade = clamp((F.L - F.s)/F.fadeOut, 0, 1);
  if(F.s >= F.L){
    var g = F.grp; p.flow = null;
    if(F.end) F.end(p);
    g.n--; if(g.n <= 0){ var k = FLOWS.indexOf(g); if(k>=0) FLOWS.splice(k,1); g.res(); }
  }
}
function pinPan(p, lp, slot){   /* 흐름을 마친 전자를 접시에 붙인다 */
  var wp = p.sp.getWorldPosition(V(0,0,0));

      if(p.flow.panStart ? (s < p.flow.sC) : (s >= p.flow.sC && p.flow.delay <= 0)) n++;

}

/* 가장자리 둘레 길 (접시 좌표) */
function angOf(p){ return Math.atan2(p.z, p.x); }
function rimPt(a, y, r){ y = y===undefined ? .262 : y; r = r || (wallR(y)-.006); return V(r*Math.cos(a), y, r*Math.sin(a)); }
function rimArc(a0, a1){

  var n = Math.max(1, Math.ceil(Math.abs(d)/0.2)), out = [];

    if(F.s >= F.tube[0] && F.s <= F.tube[1]){ nT++; }
  });

function camTo(c, dur){
  var p0 = cam.position.clone(), t0 = ctl.target.clone();
  return tween(dur, function(t){ var e = ease(t); cam.position.copy(p0).lerp(c.p, e); ctl.target.copy(t0).lerp(c.t, e); });
}

var SCN_ALL = ['rub','flip','induce','touch','plus','lift','lower'];

var scn = null;   /* {ids:[], i, id} */
function playScene(ids, qid){
  scn = {ids:ids, i:0, qid:qid};
  S.mode = 'scene';
  $('playbar').hidden = false;
  playPart();
}
function playPart(){
  var id = scn.ids[scn.i];
  drawDots();
  var cap = function(h){ var el = $('cap'); el.hidden = false; el.innerHTML = '<span class="no">' + (scn.ids.length > 1 ? (scn.i+1) + '/' + scn.ids.length : '▶') + '</span>' + h; };
  S.playing = true;
  PART[id](cap).then(function(){
    S.playing = false;
    if(!scn) return;
    if(scn.i < scn.ids.length - 1){ scn.i++; playPart(); }
    else { drawDots(true); }
  }, function(e){ S.playing = false; if(e !== 'abort') console.error(e); });
}
function drawDots(done){
  if(!scn){ $('pbDots').innerHTML = ''; return; }
  $('pbDots').innerHTML = scn.ids.map(function(_, i){ return '<span class="' + (i === scn.i && !done ? 'on' : (i < scn.i || done ? 'done' : '')) + '"></span>'; }).join('');
  $('pbPrev').disabled = scn.i === 0; $('pbNext').disabled = scn.i >= scn.ids.length - 1;
  $('pbPrev').style.visibility = $('pbNext').style.visibility = scn.ids.length > 1 ? 'visible' : 'hidden';
}
$('pbReplay').addEventListener('click', function(){ if(scn){ playPart(); } });
$('pbPrev').addEventListener('click', function(){ if(scn && scn.i > 0){ scn.i--; playPart(); } });
$('pbNext').addEventListener('click', function(){ if(scn && scn.i < scn.ids.length - 1){ scn.i++; playPart(); } });
$('pbSlow').addEventListener('click', function(){
  SPEED = SPEED === 1 ? .5 : 1; this.classList.toggle('on', SPEED !== 1);
  this.textContent = SPEED === 1 ? '🐢 느리게' : '🐇 보통 빠르기';
});

/* ── 질문 목록 ── */
function buildQList(){
  var groups = [], gmap = {};
  QS.forEach(function(q){ if(!gmap[q.g]){ gmap[q.g] = []; groups.push(q.g); } gmap[q.g].push(q); });
  $('qList').innerHTML = groups.map(function(g){
    return '<div class="qg-t">' + g + '</div><div class="qchips">' + gmap[g].map(function(q){
      return '<button class="qc" type="button" data-q="' + q.id + '">' + q.q + '</button>';
    }).join('') + '</div>';
  }).join('');
}
$('qList').addEventListener('click', function(e){ var b = e.target.closest('.qc'); if(b) pickQ(b.dataset.q); });
$('qAll').addEventListener('click', function(){ pickQ('all'); });
function pickQ(id){
  Array.prototype.forEach.call(document.querySelectorAll('.qc'), function(b){ b.classList.toggle('on', b.dataset.q === id); });
  $('qAll').classList.toggle('on', id === 'all');
  var card = $('ansCard');
  if(id === 'all'){
    card.innerHTML = '<div class="k">처음부터 끝까지</div><h3>숨은 과정 모두 보기</h3>'
      + '<p>문지르기 → 뒤집기 → 접시 올리기 → 전구 대기 → 들어 올려 대기 → 내려놓고 대기까지, 실험에서 <b>눈에 안 보였던 전자의 움직임</b>을 차례로 보여 줘요.</p>'
      + '<p>왼쪽(또는 위) 화면 아래의 <b>⏮ ⏭</b>로 장면을 건너뛸 수 있어요.</p>';
    playScene(SCN_ALL, 'all');
  } else {
    var q = QMAP[id];
    card.innerHTML = '<div class="k">' + q.g + '</div><h3>' + q.q + '</h3>' + q.a
      + '<div class="core">💡 ' + q.core + '</div>'
      + (q.parts.length ? '<button class="play" type="button" id="playAgain">▶ 3D로 다시 보기</button>' : '');
    var pa = $('playAgain'); if(pa) pa.addEventListener('click', function(){ playScene(q.parts, id); });
    if(q.parts.length) playScene(q.parts, id);
  }
  $('apScroll').scrollTop = 0;
  if(window.matchMedia('(max-width:780px)').matches){
    var r = $('stageCard').getBoundingClientRect();
    if(r.top < 0 || r.top > innerHeight*.4) $('stageCard').scrollIntoView({behavior:'smooth', block:'start'});
  }
}
/* 내 질문 적고 찾기 — 낱말 맞추기 */
function norm(s){ return (s||'').replace(/\s+/g,'').replace(/[?？!.,~]/g,'').toLowerCase(); }
function findQ(){
  var t = norm($('qIn').value);
  Array.prototype.forEach.call(document.querySelectorAll('.qc'), function(b){ b.classList.remove('hit'); });
  if(!t){ $('qMsg').textContent = ''; return; }
  var scored = QS.map(function(q){
    var s = 0; q.kw.forEach(function(k){ if(t.indexOf(norm(k)) >= 0) s += norm(k).length >= 3 ? 2 : 1; });
    return {q:q, s:s};
  }).filter(function(x){ return x.s > 0; }).sort(function(a,b){ return b.s - a.s; });
  if(!scored.length){
    $('qMsg').innerHTML = '🤔 비슷한 질문을 못 찾았어요 — <b>목록에 없는 좋은 질문</b>일 수 있어요. 아래 목록도 훑어보세요.';
    return;
  }
  var top = scored.slice(0, 3);
  top.forEach(function(x){ var b = document.querySelector('.qc[data-q="' + x.q.id + '"]'); if(b) b.classList.add('hit'); });
  $('qMsg').innerHTML = '🔎 비슷한 질문 <b>' + top.length + '개</b>를 찾았어요 — 주황 테두리를 눌러 보세요.';
  pickQ(top[0].q.id);
}
$('qGo').addEventListener('click', findQ);
$('qIn').addEventListener('keydown', function(e){ if(e.key === 'Enter' && !e.isComposing) findQ(); });

  snap = {step:S.step, phase:S.phase, flipped:S.flipped, foamN:S.foamN, q:P.q, panAt:S.panAt === 'moving' || S.panAt === 'carry' ? 'placed' : S.panAt,
          lit:S.lit, neon:neonG.visible, xray:S.xray};
  $('btnAns').classList.remove('pulse');
  document.body.classList.add('ans');
  $('ansHead').hidden = false; $('ansPanel').hidden = false;
  $('stageHint').textContent = '화면을 끌면 돌려 볼 수 있어요 · 굴리면 확대';
  setXray(true);
  S.mode = 'scene';
  buildQList();
  $('ansCard').innerHTML = '<div class="k">이렇게 써요</div><h3>내 질문의 답이 있을까?</h3>'
    + '<p>위 칸에 <b>내가 적은 질문</b>을 그대로 써 보거나, 아래 목록에서 <b>비슷한 질문</b>을 골라 보세요.</p>'
    + '<p>고르면 답과 함께 <b>3D 화면</b>이 실험에서 생략됐던 과정을 전자가 보이게 다시 보여 줘요.</p>';
  syncPanelH();
  setTimeout(resize, 30);
  setTimeout(function(){ try{ $('qIn').focus({preventScroll:true}); }catch(_){} }, 200);
  updTally(); updLegend();
  pickQ('all');
}
function leaveAns(free){
  abortAll(); scn = null;
  document.body.classList.remove('ans');
  $('ansHead').hidden = true; $('ansPanel').hidden = true; $('cap').hidden = true; $('playbar').hidden = true;
  $('stageHint').textContent = '도구를 끌어다 옮기세요 · 빈 곳을 끌면 돌려 볼 수 있어요';
  SPEED = 1; $('pbSlow').classList.remove('on'); $('pbSlow').textContent = '🐢 느리게';
  S.mode = 'live';
  if(free){ setXray(true); liveReset(false); }
  else {
    var s = snap || {step:3, phase:'flipped', flipped:true, foamN:8, q:8, panAt:'placed', lit:1, neon:true, xray:false};
    setup({phase:s.phase, flip:s.flipped, foamN:s.foamN, q:s.q, pan:s.panAt, neon:s.neon});
    S.step = s.step; S.lit = s.lit;
    setXray(!!s.xray);
    if(!s.xray) chgVisT = chgVis = (s.step >= 3 ? 0 : 1);
    camTo(CAMS.start, .8).catch(function(){});
  }
  setTimeout(resize, 30);
  updateTodo(); updateCount(); updTally(); updLegend();
}
$('btnAns').addEventListener('click', enterAns);
$('btnBack').addEventListener('click', function(){ leaveAns(false); });
$('btnFree').addEventListener('click', function(){ leaveAns(true); });
function syncPanelH(){
  var side = window.matchMedia('(min-width:781px)').matches;
  $('ansPanel').style.maxHeight = side ? ($('stageCard').offsetHeight + 'px') : 'none';
  $('ansPanel').style.height = side ? ($('stageCard').offsetHeight + 'px') : 'auto';
}
addEventListener('resize', function(){ if(document.body.classList.contains('ans')) syncPanelH(); });

/* ═══════════════════════════════════════════════════════════
   시작
   ═══════════════════════════════════════════════════════════ */
setDark(true);
S.showRubLbl = true;
setup({phase:'held', foamN:0, pan:'home', neon:false});
chgVis = chgVisT = 1;
cam.position.copy(CAMS.held.p); ctl.target.copy(CAMS.held.t); ctl.update();
resize();
updateTodo(); updateCount();
if(THUMB){
  setup({phase:'flipped', foamN:8, pan:'placed', neon:true});
  setXray(true); chgVis = chgVisT = 1; S.mode = 'scene';
  cam.position.set(0.95, 1.4, 2.85); ctl.target.set(0.05, 0.36, 0.22); ctl.update();
  S.freezeOnGlow = true;
  autoTouch().catch(function(){});
  /* 헤드리스 크롬은 화면 갱신이 띄엄띄엄이라, 고정 간격으로 직접 돌려 전구가 빛나는 순간까지 간다 */
  (async function(){
    for(var i=0;i<1200 && S.freezeOnGlow;i++){ tick(1/60); await Promise.resolve(); await Promise.resolve(); }
    for(var j=0;j<6;j++) tick(1/60);
    document.documentElement.setAttribute('data-thumb-ready','1');
  })();
} else brief(0);
raf = requestAnimationFrame(frame);

/* 검증용 훅 */
window.__eph = {
  state:function(){ return {step:S.step, lit:S.lit, phase:S.phase, foamN:S.foamN, q:P.q, A:P.A, panAt:S.panAt, neon:S.neon,
    flowing:S.flowing, xray:S.xray, mode:S.mode, frames:FRAMES, tw:TW.length, els:P.els.length, parts:PARTS.length, tally:$('tally').innerText}; },
  toStep3:function(){ closePop(); setup({phase:'flipped', foamN:8, pan:'placed', neon:true}); S.step = 3; chgVisT = 0; updateTodo(); },
  touch:function(a){ liveTouch(a === undefined ? NEON_A0 : a); },
  lift:function(){ return doLift().then(updateTodo); },
  lower:function(){ return doLower().then(updateTodo); },
  rubAll:function(){ while(S.foamN < 8) hopOne(); S.rub = RUB_NEED; ready1(); },
  flip:function(){ $('btnFlip').click(); },
  place:function(){ S.busy = false; drag = {what:'pan'}; S.panAt = 'carry'; panG.position.set(FOAM_C.x, CARRY_Y, FOAM_C.z); endDrag(); },
  ans:function(){ enterAns(); }, back:function(f){ leaveAns(!!f); },
  pick:function(id){ pickQ(id); }, speed:function(s){ SPEED = s; },
  calcA:calcA, cam:function(){ return {p:cam.position.toArray(), t:ctl.target.toArray()}; },
  glow:function(){ return {A:glowA, B:glowB}; },
  proj:function(name){
    var w = name === 'fur' ? furG.position.clone() : name === 'face' ? faceFrame().c :
            name === 'stick' ? panG.localToWorld(V(0,.8,0)) : name === 'neon' ? neonG.localToWorld(V(.16,.3,0)) :
            name === 'foamC' ? V(FOAM_C.x, PLACED_Y + .3, FOAM_C.z) : name === 'overFoam' ? V(FOAM_C.x, 1.42, FOAM_C.z) :
            name === 'panHigh' ? V(panG.position.x, rimY() + .39, panG.position.z) : name === 'rim' ? panG.localToWorld(contactPt(NEON_A0)) : V(0,0,0);
    var r = renderer.domElement.getBoundingClientRect(), v = w.project(cam);
    return {x: r.left + (v.x*.5+.5)*r.width, y: r.top + (-v.y*.5+.5)*r.height};
  }
};
})();
